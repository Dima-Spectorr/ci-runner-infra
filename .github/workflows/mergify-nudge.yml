# =============================================================================
# mergify-nudge — CI going green is an event Mergify sometimes never receives
#
# THE FAILURE
#
# Mergify is event-driven, not polling. It advances a pull request when GitHub
# delivers it a webhook — `check_run.completed` being the one that matters here.
# When that delivery is missed or late, nothing goes red and nothing says so:
# the three required checks sit green, `Mergify Merge Protections` sits on "Your
# merge queue conditions are under evaluation / Be patient, this will be updated
# soon", the queue ahead is empty, and the pull request simply waits.
#
# Measured in this repository on 2026-08-23, from the moment the LAST required
# check reported success to the moment Mergify acted:
#
#   #328  11m06s      #332   8m55s
#   #326  17m24s      #333  20m01s
#
# And the control that says it is the webhook and not Mergify being slow:
# Mergify reacts to its OWN merges in 13-14 seconds, measured three times out of
# three — the next queue entry's CI run was created 13 seconds after the
# previous pull request merged. It knows about that internally. It needs a
# webhook for the other, and when the webhook does not arrive it only moves on a
# periodic re-evaluation minutes later.
#
# The same stall was reproduced deliberately on #339: three required checks
# green at 19:34:28, still "under evaluation" at 19:43:52, and a single
# `@mergifyio refresh` posted at 19:45:27 moved it to "In merge queue" inside
# sixty seconds. That comment is the whole mechanism this workflow automates.
#
# WHY A COMMENT AND NOT AN API CALL
#
# There is no refresh endpoint. Mergify's API is `https://api.mergify.com/v1/`
# and its pull-request surface is two `…/pulls/{n}/scopes` endpoints; refresh
# exists only as the documented `@mergifyio refresh` comment command. An API
# call would also need every consuming repository to provision a Mergify
# application key as a secret, which is a real adoption cost for a mechanism
# whose entire job is to be free.
#
# WHY IT WAITS FIRST, AND USUALLY POSTS NOTHING
#
# A nudge fired unconditionally on every CI completion would be a comment per
# run per pull request — plus whatever Mergify replies with — on the majority of
# runs where the webhook arrived perfectly well and Mergify was already three
# seconds ahead of us. Comment noise is how an automation gets muted, and a
# muted automation is worse than none because it still looks installed.
#
# So this waits out the grace period, then asks GitHub a question with a factual
# answer: has ANY check-run belonging to the Mergify app been touched at or
# after the moment CI finished? If yes, Mergify has already seen this world and
# there is nothing to tell it. Only a Mergify that is demonstrably behind gets a
# comment. On a healthy repository this workflow runs to completion and posts
# nothing, every time.
#
# The asymmetry of the two ways that question can be wrong is deliberate. A
# false "behind" costs one redundant comment and a no-op refresh. A false
# "caught up" costs nothing new at all — it leaves the pull request exactly
# where it is today, waiting for the periodic re-evaluation. Neither can merge
# anything that was not going to merge anyway: `refresh` re-evaluates, it does
# not approve, bypass or queue.
#
# WHY ON FAILURE TOO, AND NOT ONLY ON SUCCESS
#
# A red check is a queue event as much as a green one. A queued pull request
# whose CI failed and whose failure Mergify has not seen holds the front of a
# serial queue until `checks_timeout` — 30 minutes in this repository's
# `.mergify.yml` — and everything behind it waits out a decision that was
# already made. Refreshing on failure is what turns that into a prompt dequeue.
#
# `cancelled`, `skipped`, `stale` and `action_required` are deliberately not
# nudged. A cancelled run is one `cancel-in-progress` superseded, so a newer run
# of the same workflow is already in flight and will nudge in its place; the
# others never produced a conclusion for Mergify to be behind on.
#
# WHY IT IS A REUSABLE WORKFLOW
#
# The same argument `shared-infra-anchor.yml` makes: fourteen repositories
# needing the same ninety lines is fourteen copies of every future fix. The
# consumer writes a caller with the `workflow_run` trigger — which cannot live
# in a reusable workflow, since `workflow_call` is the only trigger a callee may
# have — and nothing else. See `docs/ci-merge-queue-baseline.md`.
#
# WHAT THE CONSUMER MUST KNOW
#
# A `workflow_run` workflow only runs from the DEFAULT BRANCH. The pull request
# that adds it therefore proves nothing about it, and cannot: the first run is
# the first CI completion after the merge. That is not a gap in the testing, it
# is a property of the trigger, and `scripts/ci/mergify-nudge.selftest.sh`
# exists because of it — the structural properties are asserted on the text,
# with mutations, since no pull-request run can assert them on behaviour.
#
# And the sender matters. Mergify checks the permission of whoever posted a
# command, and `github-actions[bot]` is not a repository collaborator, so the
# default `sender-permission >= write` restriction does not admit it. The
# `commands_restrictions.refresh` block in `.mergify.yml` is the other half of
# this workflow, not an optional extra: without it every nudge is silently
# discarded and the only symptom is that nothing improves.
# =============================================================================

name: Mergify nudge

on:
  workflow_call:
    inputs:
      grace-seconds:
        description: >-
          How long to wait before asking whether Mergify is behind. This was
          sized as a budget for the webhook arriving NORMALLY, and across the
          eleven nudged pull requests measured in this repository it has been
          paid every time and collected on none: Mergify re-evaluated inside
          the grace window ZERO times. On #372 the window plus one retry cost
          43 of the 184 seconds between CI going green and the merge — the
          single largest span anyone here controls. It is not a safety margin, it is a
          delay applied to every run to avoid a comment on some of them, and
          that comment is cheap: Mergify answers a redundant refresh with
          "already running from a previous command" and does no extra work.
          5 leaves the probe below meaningful (a check-run that lands between
          CI ending and here still short-circuits) without paying for it.
        required: false
        default: 5
        type: number
      attempts:
        description: >-
          How many times to ask BEFORE nudging, including the first. Each extra
          attempt is a second chance for a merely-late webhook to land, priced
          at `interval-seconds` of delay on EVERY run and paying out only on
          the runs that were never stuck. At the measured hit rate of zero in
          eleven that trade is not worth making twice, so this is 1: probe once,
          and if Mergify is behind, say so immediately. The retry that matters
          is `nudge-attempts`, which retries the thing that can actually be
          lost.
        required: false
        default: 1
        type: number
      interval-seconds:
        description: >-
          The gap between attempts, and therefore dead weight unless `attempts`
          is raised above its default of 1. `grace-seconds + (attempts - 1) *
          interval-seconds` is the longest this waits before the FIRST nudge,
          and the whole ladder — that plus `nudge-attempts * confirm-seconds`,
          the last post getting a confirmation window like every other — must
          fit inside `timeout-minutes` and stay well under `checks_timeout`:
          a nudge that arrives after the entry has already been dequeued for a
          timeout is telling Mergify about a pull request it has stopped
          tracking.
        required: false
        default: 15
        type: number
      nudge-attempts:
        description: >-
          How many times to POST the command, including the first. This was 3,
          on the theory that a comment webhook is losable exactly the way the
          `check_run` webhook is, so the answer to one going missing is to send
          another. Thirty-six commands later that theory is dead, and the
          evidence against it is Mergify's own reply: every retry came back
          `Command refresh ignored because it is already running from a previous
          command`. Not lost — RECEIVED, and deduplicated. Across a full
          afternoon of nudges there is not one case where a second or third
          comment did anything the first had not already done.

          What the retries did do is add load. Every comment is a webhook the
          same Mergify installation has to process, and that installation is
          the thing being waited on: it answered a nudge in 11 seconds at 17:16,
          and 12 minutes 13 seconds by 18:16, over an afternoon in which this
          repository posted three commands per CI run on every run. That
          correlation is not proof of causation, but a retry with no measured
          benefit and a plausible cost is not a trade worth keeping.

          So: 1. Say it once. If Mergify is behind by minutes, it is behind on
          the comment channel too, and a second comment arrives in the same
          backlog as the first.
        required: false
        default: 1
        type: number
      confirm-seconds:
        description: >-
          How long to give Mergify to answer a posted command before posting
          another. Must comfortably exceed the healthy reaction, or the retry
          races a refresh that was already on its way. 45 did not: on #372
          Mergify took 90 seconds to answer nudge 1 and replied to the retries
          with "already running from a previous command" — proof they were
          received and deduplicated rather than lost, which is the one case a
          retry cannot help. 60 straddles the 12-30s healthy reaction and that
          90s outlier: a genuinely lost comment is still re-sent within the
          minute, and a slow-but-received one costs at most one duplicate
          instead of two.
        required: false
        default: 60
        type: number

permissions:
  contents: read

jobs:
  nudge:
    name: Tell Mergify that CI finished
    # GitHub-hosted, like the rest of this repository's CI: the repository that
    # defines the self-hosted fleet must not need the fleet to be healthy in
    # order to merge a fix to the fleet. A consumer inherits the same choice,
    # and should keep it — this job is three API calls and two sleeps, and
    # spending a warm pool slot on it would take a slot from a real job for
    # minutes at a time while it waits.
    runs-on: ubuntu-latest
    # 10 was too tight to be a backstop: every wait below is an input, and at
    # `confirm-seconds: 240` the ladder needs ~12 minutes, so GitHub would
    # cancel the job mid-wait and lose the final probe AND the warning — a red
    # run on a configuration this workflow accepts and documents.
    #
    # Deriving it from the inputs was the first attempt and RUNNER6 rejected
    # it, correctly: `${{ inputs.timeout-minutes }}` is a number the gate
    # cannot resolve, so it cannot rule out an expression landing on 360, and a
    # bound nobody can evaluate is not a bound. So it is a literal, chosen
    # against the thing that actually caps the ladder — the queue's 30-minute
    # `checks_timeout`, past which a nudge describes a pull request Mergify has
    # stopped tracking. Anything needing more than 20 minutes here is
    # misconfigured, not merely slow.
    #
    # `JOB_TIMEOUT_MINUTES` below MUST equal this, and the self-test asserts it
    # does: the shell clamps its own sleeps to this budget, so the two drifting
    # apart means either the clamp fires early or it never fires at all.
    timeout-minutes: 20
    permissions:
      contents: read
      # `GET /repos/{o}/{r}/commits/{sha}/check-runs` is governed by the Checks
      # permission, not by Contents — and declaring a `permissions:` block at
      # all sets every scope not listed here to `none`. Without this line the
      # "has Mergify re-evaluated yet?" probe 403s, `mergify_seen_it` fails
      # closed, and every single CI run nudges. That is the noise failure the
      # grace period exists to prevent, and it would arrive as a comment storm
      # rather than as a red job.
      checks: read
      # The one write, and the smallest one that can post a comment. Nothing
      # here approves, merges, labels or pushes.
      #
      # It is deliberately NOT `issues: write`. GitHub's permissions table
      # lists `POST /repos/{o}/{r}/issues/{n}/comments` under BOTH Issues and
      # Pull requests, and the target here is always a pull request — resolved
      # from `/commits/{sha}/pulls`, which cannot return an issue. Adding
      # `issues: write` would hand this job the ability to write to every issue
      # in the repository in exchange for nothing, on a `workflow_run` trigger,
      # which is the one place extra write scope is worth refusing.
      pull-requests: write
    steps:
      - name: Nudge Mergify if it has not seen this CI run
        env:
          GH_TOKEN: ${{ github.token }}
          # Every value the shell reads arrives as an environment variable and
          # never as `${{ }}` spliced into the script. `head_branch` and
          # `display_title` are attacker-influenced on a fork pull request, and
          # interpolation happens before the shell parses the line.
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ENDED_AT: ${{ github.event.workflow_run.updated_at }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GRACE: ${{ inputs.grace-seconds }}
          ATTEMPTS: ${{ inputs.attempts }}
          INTERVAL: ${{ inputs.interval-seconds }}
          NUDGE_ATTEMPTS: ${{ inputs.nudge-attempts }}
          CONFIRM: ${{ inputs.confirm-seconds }}
          # Must equal the job's `timeout-minutes:` above; the self-test
          # asserts it, because the clamp below is derived from this value and
          # the cancellation it exists to prevent is driven by that one.
          JOB_TIMEOUT_MINUTES: 20
        run: |
          set -euo pipefail

          # Five `type: number` inputs reach this script — three waits in
          # seconds and two counts — and `number` in Actions is not `integer`:
          # `grace-seconds: 0.5` arrives as the literal `0.5`. `sleep` accepts
          # that, but `[ 0.5 -le 1155 ]` does not — it is an ARITHMETIC test,
          # so it prints "integer expression expected" and returns false, and
          # the clamp below reads a false there as "this wait is too long" and
          # sleeps the ENTIRE remaining budget. Half a second would have become
          # nineteen minutes: not a cryptic failure, a silent inversion of the
          # thing the clamp exists to guarantee.
          #
          # So normalise once, here, before any arithmetic sees them. Rounding
          # is UP because every one of these is a minimum — "give Mergify at
          # least this long", "post at least this many" — and rounding up is
          # the only direction that cannot make the ladder more aggressive than
          # the caller asked for. A value that is not a plain non-negative
          # decimal is a misconfiguration and fails loudly rather than being
          # silently treated as zero. That deliberately includes exponent
          # notation: `1e-7` is not a wait anyone means, and a script that
          # quietly reinterprets an unreadable number is worse than one that
          # stops and names the input.
          to_seconds() { # <input name> <value>
            local name="$1" v="$2" int frac
            case "$v" in
              ''|.|*[!0-9.]*|*.*.*)
                echo "::error::$name must be a plain non-negative number — digits and at most one '.', no sign and no exponent; got '$v'" >&2
                return 1
                ;;
            esac
            int="${v%%.*}"
            int="$(( 10#${int:-0} ))"
            if [ "$v" = "${v%%.*}" ]; then
              printf '%s\n' "$int"
              return 0
            fi
            frac="${v#*.}"
            case "$frac" in
              *[!0]*) int=$(( int + 1 )) ;;
            esac
            printf '%s\n' "$int"
          }

          GRACE="$(to_seconds grace-seconds "$GRACE")"
          ATTEMPTS="$(to_seconds attempts "$ATTEMPTS")"
          INTERVAL="$(to_seconds interval-seconds "$INTERVAL")"
          NUDGE_ATTEMPTS="$(to_seconds nudge-attempts "$NUDGE_ATTEMPTS")"
          CONFIRM="$(to_seconds confirm-seconds "$CONFIRM")"

          # Everything below waits, and GitHub cancels the job at
          # `timeout-minutes` without running the final probe or the warning —
          # so a widened `confirm-seconds` would turn a supported configuration
          # into a red run, with no output saying why. Sleep against a deadline
          # instead: the ladder then degrades to a shorter last wait, which is
          # a worse answer than the operator asked for but still an answer.
          # The 45s reserve covers job setup before this line plus the `gh`
          # calls after the last sleep.
          #
          # A wait that could not be taken IN FULL means the budget is spent,
          # and that has to be reported rather than swallowed. Returning 0
          # there degrades the ladder into a comment burst: every later wait
          # returns instantly, so the remaining nudges post back-to-back with
          # none of the confirmation window they exist to provide, and the run
          # ends by telling the operator to audit their webhook deliveries when
          # the real fault is a configuration that does not fit in the job.
          # `out_of_time` below carries that verdict, and the ladder stops.
          deadline=$(( $(date -u +%s) + JOB_TIMEOUT_MINUTES * 60 - 45 ))
          out_of_time=0
          bounded_sleep() { # <seconds>; returns 1 when the budget is spent
            local left=$(( deadline - $(date -u +%s) ))
            if [ "$left" -le 0 ]; then
              return 1
            fi
            if [ "$1" -gt "$left" ]; then
              echo "::warning::waiting ${left}s instead of $1s — the configured ladder does not fit in the job's ${JOB_TIMEOUT_MINUTES}-minute timeout; narrow the waits, and note the queue's checks_timeout caps this anyway"
            fi
            # `-ge`, not `-gt`. A wait that exactly equals the remaining budget
            # fits, so it does not warn — but it leaves nothing behind it, and
            # reporting success there hands the caller a budget of zero dressed
            # up as a budget. The verdict this function returns is not "did the
            # sleep fit", it is "is there still time after it".
            if [ "$1" -ge "$left" ]; then
              sleep "$left"
              return 1
            fi
            sleep "$1"
          }

          # A caller wired to something other than a pull-request CI run. There
          # is no queue entry to be behind on, so there is nothing to refresh.
          if [ "$RUN_EVENT" != "pull_request" ]; then
            echo "::notice::the run was triggered by '$RUN_EVENT', not a pull request — nothing to refresh"
            exit 0
          fi

          case "$CONCLUSION" in
            success|failure|timed_out) ;;
            *)
              echo "::notice::conclusion '$CONCLUSION' is not a verdict Mergify can act on — not nudging"
              exit 0
              ;;
          esac

          # Which pull requests this commit is the head of. Read from the API
          # rather than from `workflow_run.pull_requests`, which GitHub leaves
          # EMPTY for a fork pull request — the one case where a silent nudge
          # failure would be hardest to notice, because forks are rare enough
          # that nobody would connect it to this workflow.
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
                   --jq '.[] | select(.state == "open") | select(.draft == false) | .number')"
          if [ -z "$prs" ]; then
            echo "::notice::no open, non-draft pull request has $HEAD_SHA at its head — nothing to refresh"
            exit 0
          fi

          # The instant CI finished, as a comparable number. Everything below
          # asks one question against it: did Mergify touch anything AFTER this?
          ci_ended="$(date -u -d "$RUN_ENDED_AT" +%s)"

          # The newest timestamp on any check-run belonging to the Mergify app.
          # Matched on `app.slug`, not on a check name: `Mergify Merge
          # Protections` and the queue's own check are both Mergify's, the names
          # are Mergify's to change, and a name that stops matching would make
          # this report "behind" forever — a nudge on every single run.
          #
          # `completed_at // started_at` because a check still in progress has
          # no completion time, and a Mergify check that STARTED after CI
          # finished is already evidence that it has seen this world.
          mergify_seen_it() {
            local newest
            # `--paginate`, not a big `per_page`: this endpoint truncates
            # silently, and a page that happens to cut Mergify's own check off
            # the end reads as "still behind". That used to cost one redundant
            # comment; it is now the ladder's exit condition, so it costs every
            # comment in the ladder. Each page is its own JSON document, hence
            # `jq -s` to slurp them before the query runs.
            newest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
                        | jq -rs '[.[].check_runs[] | select(.app.slug == "mergify") | .completed_at // .started_at]
                                  | map(select(. != null)) | max // ""')"
            [ -n "$newest" ] || return 1
            [ "$(date -u -d "$newest" +%s)" -ge "$ci_ended" ]
          }

          bounded_sleep "$GRACE" || out_of_time=1

          attempt=1
          while true; do
            if mergify_seen_it; then
              echo "::notice::Mergify re-evaluated $HEAD_SHA on its own after attempt $attempt — no nudge needed"
              exit 0
            fi
            # Two statements, not `A && B || C`: that chain runs `break` when
            # A is true and B is false, which is what we want here and is
            # still the wrong shape to write — SC2015 rejects it because the
            # next person to add a third clause gets if-then-else semantics
            # they did not ask for. Split, and the intent survives the edit.
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              break
            fi
            [ "$out_of_time" -eq 0 ] || break
            attempt=$((attempt + 1))
            bounded_sleep "$INTERVAL" || out_of_time=1
          done

          # Mergify is behind. The command has to START the comment, with a
          # single space after `@mergifyio`, or Mergify does not read it at all
          # — so the explanation goes underneath, where it is for the human
          # reading the thread and wondering what posted this.
          post_nudge() { # <attempt>
            local body again=""
            # Never `cmd && printf …` inside the substitution below: on the
            # first attempt the test is false, the substitution's exit status
            # is 1, and `set -e` kills the job at the moment everything is
            # working normally.
            if [ "$1" -gt 1 ]; then
              again=" Nudge $1 of $NUDGE_ATTEMPTS: the previous command went unanswered for ${CONFIRM}s, which is what a lost webhook looks like."
            fi
            body="$(printf '%s\n\n%s\n\n%s\n' \
              '@mergifyio refresh' \
              "CI finished ($CONCLUSION) at \`$RUN_ENDED_AT\` and no Mergify check-run has been updated since.$again" \
              "Automated by \`mergify-nudge\`; see the [CI run]($RUN_URL) and \`docs/ci-merge-queue-baseline.md\`.")"

            # One comment per pull request, and the loop is not defensive
            # paranoia: a commit can be the head of more than one open pull
            # request, and refreshing only the first would leave the others in
            # the exact state this exists to clear.
            #
            # Fed by a heredoc rather than `for pr in $prs`, which is unquoted
            # word splitting on purpose and reads to every linter as the bug it
            # usually is, and rather than a pipe, which would run the body in a
            # subshell whose failures `set -e` cannot see.
            while read -r pr; do
              [ -n "$pr" ] || continue
              gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$body" --silent
              echo "::notice::nudged pull request #$pr (attempt $1) — Mergify had not re-evaluated $HEAD_SHA since CI finished"
            done <<EOF
          $prs
          EOF
          }

          # A loop that, at the default `nudge-attempts: 1`, posts once and
          # falls straight through to the confirmation below. It is written as
          # a loop because the input exists, and the input exists because the
          # ORIGINAL reasoning — a comment rides the same webhook channel that
          # dropped the `check_run` event, so a redelivery is cheap insurance —
          # is sound in shape and was simply wrong about this installation.
          #
          # What the retries actually did, every time: came back `Command
          # refresh ignored because it is already running from a previous
          # command`. That is Mergify saying RECEIVED AND DEDUPLICATED, not
          # lost. No second or third comment was ever seen doing something the
          # first had not. And on 2026-08-24 a HUMAN refresh on the same pull
          # request was answered in the same delayed batch as the bot's — one
          # processing queue, minutes behind, dropping nothing. A second
          # comment into a backlog lands in the same backlog.
          #
          # So the default is 1. Raising it costs a real comment into the
          # worker being waited on; only a measurement showing a genuinely
          # LOST command — an Nth answered where the first was never
          # acknowledged at all — justifies paying that.
          nudge=1
          while true; do
            post_nudge "$nudge"
            [ "$nudge" -lt "$NUDGE_ATTEMPTS" ] || break
            bounded_sleep "$CONFIRM" || out_of_time=1
            if mergify_seen_it; then
              echo "::notice::Mergify answered nudge $nudge — re-evaluated $HEAD_SHA"
              exit 0
            fi
            # After the probe, never before it: a spent budget still deserves
            # the answer to the nudge already posted. It is the NEXT post that
            # must not happen, because there is no window left to answer it in.
            [ "$out_of_time" -eq 0 ] || break
            # And ask the clock, not just the flag. The flag is set by the last
            # sleep, but the PROBE between that sleep and this line spends real
            # time too — a couple of paginated `gh api` calls — so a wait that
            # fitted can still leave the deadline behind us by the time we get
            # here. The question before posting again is not "did the last wait
            # fit" but "is there any window at all left to answer the next post
            # in", and only the clock answers that one.
            [ "$(( deadline - $(date -u +%s) ))" -gt 0 ] || break
            nudge=$((nudge + 1))
          done

          # The loop breaks straight after the LAST post, having never given that
          # post the confirmation window every earlier one got. Skipping it does
          # not just lose a chance to exit clean, it manufactures a false alarm:
          # on #372 Mergify's reply landed in the same second as this line and
          # the job still told the operator to go audit their webhook deliveries.
          # The warning below is only true if it survives one more wait.
          #
          # Guarded, because the loop above breaks for two different reasons:
          # having posted every nudge, or having run out of budget — and in the
          # second case it has ALREADY waited and probed, so repeating it here
          # would report a wait that never happened.
          if [ "$out_of_time" -eq 0 ]; then
            bounded_sleep "$CONFIRM" || out_of_time=1
            if mergify_seen_it; then
              echo "::notice::Mergify answered nudge $nudge — re-evaluated $HEAD_SHA"
              exit 0
            fi
          fi

          # Every comment we are willing to send has been sent and Mergify has
          # still not moved. Do not fail the job: the pull request is not broken
          # and Mergify will reach it. But say so, and say the right thing —
          # this used to send the reader to audit webhook DELIVERIES, which is
          # the wrong subsystem. Measured 2026-08-24: Mergify answered a nudge
          # in 11s at 17:16 and in 12m13s at 18:16, and it answered a HUMAN
          # refresh on the same pull request with the same delay, in the same
          # batch. Nothing was dropped; the installation's processing is simply
          # minutes behind, and no comment this workflow posts can shorten that.
          #
          # Unless the ladder never finished, which IS a local fault and IS
          # fixable — a configured ladder too long for the job's budget — so
          # that arm names the configuration instead.
          if [ "$out_of_time" -ne 0 ]; then
            echo "::warning::stopped after $nudge of $NUDGE_ATTEMPTS refresh commands — the ladder does not fit in the job's ${JOB_TIMEOUT_MINUTES}-minute budget, and posting the rest back-to-back would give Mergify no window to answer any of them; narrow the waits"
          else
            echo "::warning::posted $NUDGE_ATTEMPTS refresh command(s); Mergify had not re-evaluated $HEAD_SHA ${CONFIRM}s later. The command was accepted, not lost — this is the Mergify installation running behind, and no further comment shortens it. Expect the merge once it catches up."
          fi
