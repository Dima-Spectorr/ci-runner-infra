# =============================================================================
# merge-lane — the merge queue, inside the repository
#
# WHAT THIS REPLACES, AND WHY
#
# Mergify. The full argument, with the measurements, is in
# `scripts/ci/merge-lane-decision.sh` and `docs/merge-lane.md`; the short form
# is that a third-party queue learns that CI went green over a webhook, and a
# webhook that is missed leaves a green pull request sitting on "under
# evaluation" for 9 to 25 minutes. That was never solved. `mergify-nudge` capped
# it at about three and a half minutes by paying a runner to SLEEP and then
# posting `@mergifyio refresh`, which is a workaround whose own cost was a
# billed idle runner on every CI completion in every private repository.
#
# GitHub does not need to be told that CI finished. It finished it. A
# `workflow_run` trigger in the same repository is dispatched by GitHub itself,
# and the merge decision happens in the run that observes the green — seconds,
# not minutes, with no third party in the path.
#
# The second thing this removes is the speculative draft. Mergify validates a
# queued pull request on a throwaway branch at `mergify/merge-queue/<sha>`,
# which is a second full CI run per merge, and on one consumer repository 87 of
# 122 of those runs failed — almost all at `Set up runner` / `Initialize
# containers` / `Complete runner`, i.e. the fleet rather than the diff. Each
# failure was a terminal dequeue of a good pull request. This lane validates IN
# PLACE, on the pull request's own branch: a branch already current with the
# base merges with no second run at all, and one whose base moved gets exactly
# one re-run, on its own branch, where a failure is the author's to read.
#
# WHY A REUSABLE WORKFLOW
#
# The same argument `shared-infra-anchor.yml` and the retired `mergify-nudge`
# made: fourteen repositories needing the same logic is fourteen copies of every
# future fix. The consumer writes a caller with the `workflow_run` trigger —
# which cannot live here, since `workflow_call` is the only trigger a callee may
# declare — and passes its own required-check names.
#
# WHY IT RUNS THE DEFAULT BRANCH'S CODE, ALWAYS
#
# `workflow_run` checks out the default branch, not the pull request, and that
# is a security property this workflow depends on rather than an accident. This
# job holds a token that can merge to the default branch. If it ever executed a
# script authored in the pull request under evaluation, any contributor could
# merge anything by editing that script. Nothing below reads a single byte from
# the head ref: the decision script is the one checked out here, the check names
# come from the caller's inputs, and every fact about the pull request is read
# from the API.
#
# WHAT THE CONSUMER MUST PROVIDE
#
# A GitHub App with `Contents: write`, `Pull requests: write`, `Workflows:
# write`, `Checks: read`, `Commit statuses: read`, `Actions: read`,
# `Metadata: read`, installed on the
# repository — `Commit statuses` because a required context may be a legacy
# status rather than a check-run, and a 403 there is a surface the lane cannot
# see rather than a surface with nothing on it; `Workflows` because GitHub
# refuses an App token that writes under `.github/workflows/` whatever
# `Contents` says, and a squash merge counts as writing them, so without it
# every workflow pull request is refused on every pass — plus
# `Issues: write` if and only if `status-issue` is set, which GitHub treats as a
# separate permission from `Pull requests: write` even though a pull request is
# an issue. Without it the lane warns and keeps merging. This is
# DELIBERATELY NOT the fleet's runner App: `docs/github-app-permissions.md`
# argues that that App must never hold `Contents: write`, and that argument is
# still correct. Merge authority gets its own identity and its own blast radius.
#
# The App token is not a convenience. A merge or a branch update performed with
# the built-in `GITHUB_TOKEN` triggers NO further workflow — so the re-run this
# lane depends on would never start, and the release and deploy workflows that
# fire on a push to the default branch would silently stop firing. Wiring this
# with `GITHUB_TOKEN` does not fail; it quietly does half the job.
# =============================================================================

name: Merge lane

on:
  workflow_call:
    inputs:
      base:
        description: The branch this lane merges into. One lane per base.
        required: false
        default: main
        type: string
      required-checks:
        description: >-
          Newline-separated check names that must be green on the head sha
          before anything merges. These are the repository's own required
          checks, named exactly as they appear on the pull request. A name that
          matches nothing is counted as MISSING and blocks the merge — renaming
          a job without updating this list stops the lane rather than silently
          ungating it.
        required: true
        type: string
      base-health-checks:
        description: >-
          Newline-separated check names the BASE-HEALTH gate reads on the tip of
          the base, if they should differ from `required-checks`. Unset means
          "the same list", which is the strict reading and the right default.


          Why it exists: arming that gate at all means running something on a
          push to the base, and on a repository whose required suite takes half
          an hour that is one half-hour run per merge -- twenty an hour at the
          rate this lane now drains a backlog -- to answer a single yes/no
          question. Naming a cheap post-merge job here (a typecheck-and-unit
          gate, say) keeps the gate armed at a fraction of the cost while
          `required-checks` goes on gating the merges themselves.


          A name that matches nothing counts as MISSING, and missing does NOT
          halt this gate -- it fails open, unlike everything else in this
          workflow. So a typo here does not deadlock the lane; it silently
          disarms the gate. Read the queue snapshot after changing it.
        required: false
        default: ''
        type: string
      base-health-grace-seconds:
        description: >-
          How long the lane waits for the base tip to answer for itself before
          merging onto it unvouched. Only reaches a repository whose base-health
          checks actually publish on the tip; where nothing does, the gate is
          inert and there is nothing to wait for.


          Why a ceiling exists at all: the job answering for the tip is keyed to
          supersede its own runs, which is the only shape that answers for the
          CURRENT commit, so on a busy base it is routinely cancelled before it
          reports. An unbounded wait would stall the lane hardest exactly where
          it merges most. Past this the lane proceeds with a warning.


          Raising it is almost never the fix. A lane warning that it proceeded
          unvouched on every pass has a health job that never finishes, and the
          number is not what is wrong.
        required: false
        default: 900
        type: number
      base-health-max-staleness-seconds:
        description: >-
          How old a base-health answer may be and still vouch for a tip that has
          not answered yet. `0`, the default, means only the tip's own answer
          counts -- the rule the gate shipped with.


          Set it on a base that moves faster than its health job answers. The
          grace above bounds the wait for ONE tip and nothing bounds the
          sequence: the clock is keyed to the tip's commit date, so every merge
          restarts it and the lane holds forever while the base moves the whole
          time. It is silent when it happens -- the pass halts before it
          classifies anything, so the run reports `0 action(s)` with no
          `merge:ready` line, which is also what an idle lane looks like.


          What it relaxes is narrow. The window is consulted ONLY when the tip
          reads `unanswered`; a tip that answered red still halts, an ancestor
          inside the window that answered red halts too rather than being walked
          past, and the window is closed for the rest of any run in which the
          lane has already merged -- so it can never pour a batch onto a tip the
          lane itself created. What it replaces is not a strict gate but the
          fail-open fallback: past the grace the lane merges on NO answer at
          all, and a green answer from four minutes ago is strictly more.


          A sane value is a small multiple of how long the health job takes.
          Much larger and it is a fail-open with extra steps.
        required: false
        default: 0
        type: number
      review-bots:
        description: >-
          Newline-separated logins of the automated reviewers a green pull
          request waits for before it merges. Empty — the default — means no
          wait at all, which is how this lane behaved before the input existed.


          It exists because the fleet stopped paying for a review of a red pull
          request. Codex reviews cost credits and a red pull request is going to
          be pushed again, so the review is now requested when CI goes GREEN —
          which is the same `workflow_run` completion that dispatches this lane.
          Without a wait the lane merges while the reviewer is still reading,
          and the credits buy a comment on a closed pull request.


          The logins are the ones that appear on the pull request, and they are
          bots rather than people —
          `copilot-pull-request-reviewer[bot]` is what this fleet names.


          NAME ONLY A REVIEWER THAT CAN ACTUALLY ANSWER. This list is what the
          gate EXPECTS, so a login that never answers is a permanent shortfall,
          not a harmless extra: every merge is then annotated UNREVIEWED, and a
          warning that fires on every merge stops being read. It costs one grace
          period per pull request and nothing else, because this gate FAILS
          OPEN, but the annotation is the real cost. Measured on this fleet with
          `chatgpt-codex-connector[bot]` named and never armed: two weeks of
          `answered=1 expected=2` on every pull request in seventeen
          repositories.
        required: false
        default: ''
        type: string
      review-grace-seconds:
        description: >-
          How long a green pull request waits for `review-bots` before it merges
          unreviewed and says so in a warning annotation.


          The fail-open direction is deliberate and it is the operator's call,
          recorded here: the reviewers are third parties, and a Codex account
          that runs out of credits publishes NOTHING, for any pull request,
          until somebody tops it up. A gate that failed closed on that would
          hand a vendor's billing page merge authority over the whole fleet.
          A gate that fails open costs, at worst, one unreviewed merge per pull
          request and a warning naming exactly what happened.


          SIXTY SECONDS, AND THE OPERATOR'S REASONING FOR IT.


          It was ten minutes, chosen as "comfortably longer than either reviewer
          takes". That reasoning had the clock wrong. A reviewer does not start
          when this gate starts: Copilot begins at PULL REQUEST OPEN and has had
          the entire CI run — minutes, on this fleet — to finish before the lane
          ever looks. Ten minutes on top of that is ten minutes of nothing, paid
          on every pull request in the fleet, and it is the single largest source
          of green-to-merged latency left in this lane.


          Sixty seconds is what the gate is actually for: closing the race
          between the review and the merge, which are dispatched by the SAME
          `workflow_run` completion and land within a second of each other. It
          is not a wait for a reviewer to think.


          THE COST, STATED PLAINLY, BECAUSE IT IS REAL. Codex is not asked until
          CI goes green — that is the whole point of `codex-review.yml`, which
          declines to buy a review of a red pull request — so it starts at the
          same instant this clock does and takes 2-4 minutes. At sixty seconds
          it will essentially never be waited for, and its review will arrive on
          a merged pull request. The gate fails open, so nothing breaks and
          nothing is lost except the ordering; the findings are still published
          and still readable. A repository that wants Codex to land BEFORE the
          merge must pass a number larger than the review takes, and pay that
          latency on every pull request to get it.
        required: false
        default: 60
        type: number
      runs-on:
        description: >-
          Where the lane runs. Defaults to `ubuntu-latest`, which is free and
          unmetered on a PUBLIC repository. A private repository should pass a
          self-hosted label instead: GitHub-hosted minutes are billed there, and
          self-hosted minutes are not. The job holds a slot for as long as the
          walk takes -- a few seconds on a quiet base, minutes on one with
          dozens of open pull requests, bounded by `pass-budget-seconds`. The
          label must resolve to a LINUX runner: the lane is bash and reads
          `date -u -d` and `mapfile`, neither of which the fleet's Windows pool
          provides.


          ONE LABEL, OR A JSON ARRAY IN A STRING — never a YAML sequence. This
          is a `type: string` input, so `runs-on: [self-hosted, linux]` in your
          caller is a parse error and the workflow never starts. Write
          `runs-on: my-pool-label` for one label, or
          `runs-on: '["self-hosted", "linux"]'` for several.
        required: false
        default: ubuntu-latest
        type: string
      inflight-budget-seconds:
        description: >-
          How long the lane waits on a pull request whose checks are still
          running or missing before releasing it and saying so. This is
          Mergify's `checks_timeout`, kept, and for the same reason: without it
          a re-run that never reports holds a serial lane forever.
        required: false
        default: 1800
        type: number
      pass-budget-seconds:
        description: >-
          How long the lane may spend WALKING the open list before it stops,
          reports what it did not reach and exits on its own terms. A different
          clock from `inflight-budget-seconds` above: that one is how long a
          pull request may sit in flight, this one is how long the run may take.

          It exists because the walk costs API calls per open pull request, so
          it grows with the SIZE of the repository rather than the depth of the
          queue. A base with dozens of open pull requests can outrun the job's
          `timeout-minutes` -- and a job killed by that ceiling is reported by
          GitHub as `cancelled`, exactly like an operator cancelling it, with no
          annotation, no job summary and no queue update. The lane must run out
          of time first so that it can SAY it ran out of time.

          Raise it only alongside the job timeout; the self-test asserts the
          budget still leaves two minutes to publish. `0` disables the deadline
          and hands the job's ceiling back the job -- available on purpose, and
          not recommended.
        required: false
        default: 600
        type: number
      require-up-to-date:
        description: >-
          Whether a pull request must be up to date with the base before the
          lane will merge it. `auto`, the default, asks the base branch for its
          own effective rules and matches them, which is the only answer that
          cannot drift out of step with the repository. `true` or `false` pin
          it, for a base whose rules the lane's token cannot read.

          The lane must never be stricter than the branch it merges into. On a
          base that does not set GitHub's strict required-status-checks policy,
          updating a branch that is behind throws away a green suite and spends
          a full CI run to rebuild the same answer -- and on a busy repository
          the base moves again before that run finishes, so the pull request
          never converges and the lane spends its whole action budget on
          updates instead of merges.
        required: false
        default: auto
        type: string
      max-actions:
        description: >-
          How many pull requests one acquisition of the lane may act on. A burst
          of ready pull requests drains in one run rather than one per CI
          completion. Bounded because an unbounded loop against a repository
          that keeps producing candidates is a job that never ends. On a base
          that requires branches to be up to date the lane re-reads the world
          between every action, so this is also how many full walks of the open
          list a run performs; on a base that does not, the budget is spent from
          a single walk.
        required: false
        default: 4
        type: number
      require-label:
        description: >-
          If set, only pull requests carrying this label are candidates. Empty
          means every open, non-draft, unconflicted pull request on the base is
          a candidate, which is the behaviour Mergify's `auto_merge_conditions`
          had here and the default this fleet migrates onto.

          DO NOT WIRE THIS STRAIGHT TO A VARIABLE. A bare `vars.X` expression
          renders as an empty string when the variable is unset, mistyped, or
          cleared later by someone tidying settings — and empty here means "no
          label required". A repository arming the lane against a backlog would
          then merge all of it because of a missing setting. Supply a fallback:
          `vars.MERGE_LANE_REQUIRE_LABEL || 'ready-to-merge'`, in an expression.
          Widening becomes a pull request, the right price for that decision.

          The expression syntax is deliberately NOT written out here. An
          Actions expression inside an input DESCRIPTION is still parsed, and
          `vars` is not in scope at that point — it is an "Unrecognized
          named-value" and the workflow fails at startup with no jobs and no
          log. Measured 2026-08-25: it took every lane run in this repository
          down for an hour, silently, because a startup failure produces
          nothing to read. The caller example in `docs/merge-lane.md` shows the
          full line; a description is prose, and prose is where it belongs.
        required: false
        default: ''
        type: string
      pin-bump-actor:
        description: >-
          The one author whose pin-only updates may merge WITHOUT the label —
          in practice `dependabot[bot]`, which is what keeps a repository
          tracking the shared workflows automatically instead of waiting for
          someone to label the same bump in every repository every week.

          Narrow on purpose. The waiver applies only when the pull request is
          by this author AND every changed line names a `pin-bump-repo`
          reusable workflow; a bot pull request that also edits a job falls
          back to the label. It waives the LABEL only — required checks and
          base health still decide whether it merges.

          Empty (the default) disables it, so a repository that has not asked
          for the waiver keeps a pure label gate.
        required: false
        default: ''
        type: string
      pin-bump-repo:
        description: >-
          The repository whose pins `pin-bump-actor` is trusted to move. A pin
          line naming anything else is not a pin bump, and the label applies.
        required: false
        default: 'ci-runner-infra'
        type: string
      priority-label-prefix:
        description: >-
          Labels beginning with this prefix carry a number that orders the lane,
          lowest first, default 50. A docs-only fix does not have to queue
          behind an infrastructure change — an ordering Mergify's serial queue
          could not express and GitHub's native queue cannot either.
        required: false
        default: 'merge-lane/priority-'
        type: string
      status-issue:
        description: >-
          Number of an issue whose BODY the lane rewrites with the queue after
          every run. Optional: the same table is always written to the run's job
          summary, which costs nothing and needs no permission. This exists for
          the person who wants one bookmarkable page that is always current
          instead of having to find the newest lane run.

          The body is REWRITTEN, never commented on — an edit notifies nobody,
          where a comment every fifteen minutes would make the issue unreadable
          within a day. Pin the issue so it stays at the top of the list.

          Needs `Issues: write` on the merge App, which GitHub treats as a
          SEPARATE permission from `Pull requests: write` even though a pull
          request is an issue. Without it the lane warns once per run and keeps
          merging; a queue view that cannot be published is not a reason to stop
          merging.
        required: false
        default: ''
        type: string
      implementation-repository:
        description: >-
          Where `scripts/ci/merge-lane.sh` lives. A reusable workflow's
          `actions/checkout` clones the CALLER, not the callee, so the lane has
          to name its own repository to find its own driver.
        required: false
        default: Dima-Spectorr/ci-runner-infra
        type: string
      implementation-ref:
        description: >-
          The ref of `implementation-repository` to run. LEAVE IT UNSET. Empty
          means "the commit this workflow file was called at", read from
          `github.job_workflow_sha`, so the driver and the workflow are the same
          release by construction and there is nothing left to keep in sync.


          It used to default to `main`, and every caller therefore had to repeat
          its `uses:` sha here. That second sha is the version skew the pin gate
          exists to stop, and it is worse than an unpinned one: Dependabot bumps
          a `uses:` line and cannot see an input value, so an automatic update
          moved the workflow and left the driver behind — a pinned workflow
          quietly running an older release's decision logic. Set this only to
          run a driver deliberately different from the workflow, which is a
          debugging move, not a configuration.
        required: false
        default: ''
        type: string
      dry-run:
        description: >-
          Compute and log every verdict, act on none. The honest way to land
          this workflow: a `workflow_run` workflow cannot run on the pull
          request that adds it, so the first live run is the first CI completion
          after the merge. Merge it in dry-run, read a few real verdicts, then
          flip it.
        required: false
        default: false
        type: boolean
    secrets:
      app-id:
        description: App ID of the merge App.
        required: true
      app-private-key:
        description: Private key of the merge App.
        required: true

permissions:
  contents: read

jobs:
  lane:
    name: Merge lane
    # dynamic-runner-allowed(lane, #402): the label is a workflow_call input, scoped by the calling repository
    #
    # A `type: string` input cannot carry a list, so several labels arrive as a
    # JSON array inside the string and are decoded here. Without the
    # `startsWith` guard `fromJSON` would be handed `ubuntu-latest` and fail, so
    # the common single-label case takes the string through untouched.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 15

    # THE LOCK, AND THE REASON IT IS NOT A QUEUE.
    #
    # GitHub's `concurrency` holds ONE running run and ONE pending run; a third
    # arrival cancels the pending one. That is mutual exclusion, not a FIFO, and
    # trying to use it as a queue would silently drop entries.
    #
    # It does not have to be a queue. The lane keeps no list — it recomputes the
    # candidate set from the API every time it acquires the lock. So the run
    # that gets cancelled while pending loses nothing: whatever it would have
    # seen, the run that replaced it sees too, and more recently.
    #
    # `cancel-in-progress: false` is load-bearing. Cancelling a lane mid-merge
    # is how a branch gets updated and then abandoned, or worse, killed between
    # the merge call and the log line that records it.
    concurrency:
      group: merge-lane-${{ inputs.base }}
      cancel-in-progress: false

    permissions:
      # Deliberately minimal, and NOT how the merge is authorised. Everything
      # that writes uses the App token below; `GITHUB_TOKEN` here only checks
      # out the default branch. Merging with it would trigger no downstream
      # workflow, which is the failure this whole design turns on.
      contents: read

    steps:
      # THE IMPLEMENTATION REPOSITORY, NOT THE CALLER'S.
      #
      # In a `workflow_call` the `github` context belongs to the CALLER, so a
      # bare `actions/checkout` here would clone the consumer's tree — which
      # does not contain `scripts/ci/merge-lane.sh`, and the run would die at
      # the last step. `shared-infra-anchor.yml` relies on exactly that
      # behaviour, because its steps run the CALLER's compose file; this
      # workflow needs the opposite, and has to say so.
      #
      # There is no context naming the callee's REPOSITORY, so that stays an
      # input. There is one naming its REF: `github.job_workflow_sha` is the
      # commit of the reusable workflow file this job is running, which is
      # exactly the sha the caller's `uses:` line resolved to. Defaulting to it
      # makes driver and workflow the same release by construction.
      #
      # The old default was `main`, so every caller repeated its `uses:` sha as
      # an input — a second, unchecked pin eight lines below the first. That is
      # the drift the pin gate exists to prevent, and Dependabot made it worse
      # rather than better: it rewrites a `uses:` line and cannot see an input
      # value, so an automatic update moved the workflow and left the driver on
      # the previous release, silently.
      - name: Check out the lane's implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.implementation-repository }}
          ref: ${{ inputs.implementation-ref || github.job_workflow_sha }}
          persist-credentials: false

      # THE POOL IMAGES DO NOT SHIP `gh`, AND THE LANE IS ALL `gh api`.
      #
      # GitHub-hosted images have it, the fleet's self-hosted images do not, and
      # the driver reads every fact through `gh api ... || true`. So on a pool
      # host a missing binary read as "no facts available", the lane concluded
      # there was nothing to merge, and the job went green — seven repositories
      # reporting a healthy lane that could not have merged anything.
      - name: Ensure the GitHub CLI
        run: bash scripts/ci/ensure-gh.sh

      - name: Mint the merge App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Run the lane
        env:
          # The App token, not `github.token`. See the header.
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LANE_BASE: ${{ inputs.base }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
          BASE_HEALTH_CHECKS: ${{ inputs.base-health-checks }}
          REVIEW_BOTS_INPUT: ${{ inputs.review-bots }}
          REVIEW_GRACE: ${{ inputs.review-grace-seconds }}
          BUDGET: ${{ inputs.inflight-budget-seconds }}
          PASS_BUDGET: ${{ inputs.pass-budget-seconds }}
          MAX_ACTIONS: ${{ inputs.max-actions }}
          REQUIRE_UP_TO_DATE: ${{ inputs.require-up-to-date }}
          REQUIRE_LABEL: ${{ inputs.require-label }}
          PIN_BUMP_ACTOR: ${{ inputs.pin-bump-actor }}
          PIN_BUMP_REPO: ${{ inputs.pin-bump-repo }}
          PRIORITY_PREFIX: ${{ inputs.priority-label-prefix }}
          BASE_HEALTH_GRACE: ${{ inputs.base-health-grace-seconds }}
          BASE_HEALTH_MAX_STALENESS: ${{ inputs.base-health-max-staleness-seconds }}
          STATUS_ISSUE: ${{ inputs.status-issue }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: bash scripts/ci/merge-lane.sh
