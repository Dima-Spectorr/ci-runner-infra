name: Branch reaper

# Deletes branches that were merged and have not moved since, after a grace
# period. Reusable, and wired the same way the merge lane is, because it is the
# same problem: a schedule-triggered workflow is dispatched from the DEFAULT
# BRANCH only, so nothing here runs on the pull request that changes it.
#
# WHY THIS EXISTS AT ALL
#
# The merge lane squash-merges and leaves the head branch behind, and every
# session in this fleet works on its own branch in its own worktree. This
# repository accumulated 256 remote branches in about a week. That is not
# untidiness — `git branch -r` is how a session finds out whether another
# session already has its task in flight, and a list nobody can read stops
# answering that question.
#
# WHY IT IS A SEPARATE WORKFLOW FROM THE LANE
#
# Blast radius, in the opposite direction, and therefore different defaults. The
# lane's wrong answer merges something you can revert out of the history it just
# wrote; this one's DESTROYS commits that may exist nowhere else. So `dry-run`
# defaults to TRUE here and FALSE there, the job is capped at a number of
# deletions per run, and every unknown in the decision function is a keep.
#
# WHAT THE CONSUMER MUST PROVIDE
#
#   secrets.app-id / app-private-key   the merge App. `Contents: write` — the
#                                      same grant the lane already needs, so a
#                                      repository running the lane needs nothing
#                                      new.
#
# The decision this makes lives in `scripts/ci/branch-reaper-decision.sh` with
# 26 cases against it, and `scripts/ci/branch-reaper.selftest.sh` asserts the
# structural properties of this file with mutations — because a property
# silently removed here has to fail a check that CAN run on a pull request.

on:
  workflow_call:
    inputs:
      min-age-days:
        description: >-
          How many whole days must pass after a merge before that branch may be
          deleted. Strictly less than, so `0` means "as soon as it is merged"
          and `14` means a branch merged thirteen days ago survives. The grace
          period is most of the value of the feature: a branch merged this
          morning is a branch someone may still be reading, cherry-picking from,
          or about to reopen.
        required: false
        default: 14
        type: number
      max-deletions:
        description: >-
          The most branches one run may delete. Not a performance knob. The
          first armed run against a repository nobody has ever pruned is both
          the run that would delete the most and the run most likely to be
          acting on a keep-list somebody got wrong; the cap turns that from a
          repository-wide event into a handful of branches and a report, with
          everything else still there tomorrow.
        required: false
        default: 20
        type: number
      keep-patterns:
        description: >-
          Newline-separated globs that are never deleted, whatever their state —
          `release/*`, `legacy-*`. Matched with the shell's pattern operator,
          not a regular expression. The default branch and any branch GitHub
          reports as protected are already kept without being listed; this is
          for the long-lived branches that are neither.
        required: false
        default: ''
        type: string
      runs-on:
        description: >-
          Where the reaper runs. `ubuntu-latest` is free and unmetered on a
          PUBLIC repository; a private repository should pass a self-hosted
          label, because hosted minutes are billed there. Must resolve to a
          LINUX runner — this is bash, and reads `date -u -d`, `mapfile` and
          `declare -A`, none of which the fleet's Windows pool provides.


          ONE LABEL, OR A JSON ARRAY IN A STRING — never a YAML sequence. This
          is a `type: string` input, so `runs-on: [self-hosted, linux]` in your
          caller is a parse error and the workflow never starts. Write
          `runs-on: my-pool-label` for one label, or
          `runs-on: '["self-hosted", "linux"]'` for several.
        required: false
        default: ubuntu-latest
        type: string
      implementation-repository:
        description: >-
          Where `scripts/ci/branch-reaper.sh` lives. A reusable workflow's
          `actions/checkout` clones the CALLER, not the callee, so the reaper
          has to name its own repository to find its own driver.
        required: false
        default: Dima-Spectorr/ci-runner-infra
        type: string
      implementation-ref:
        description: >-
          The ref of `implementation-repository` to run. LEAVE IT UNSET. Empty
          means "the commit this workflow file was called at", read from the
          caller's own `uses:` line, so driver and workflow are the same release
          by construction. When that commit cannot be determined the run FAILS —
          it never falls back to the default branch (#1556).


          It used to default to `main`, so every caller repeated its `uses:` sha
          here. Dependabot rewrites a `uses:` line and cannot see an input
          value, so an automatic update moved the workflow and left the driver
          on the previous release. Set this only to run a driver deliberately
          different from the workflow.
        required: false
        default: ''
        type: string
      dry-run:
        description: >-
          Compute every verdict, delete nothing. DEFAULTS TO TRUE, and the merge
          lane's equivalent input defaults to false — that difference is
          deliberate and is the main safety property of this workflow. Anything
          but the exact string `false` is a dry run.
        required: false
        default: true
        type: boolean
    secrets:
      app-id:
        description: App ID of the merge App.
        required: true
      app-private-key:
        description: Private key of the merge App.
        required: true

permissions:
  contents: read

jobs:
  reap:
    name: Branch reaper
    # dynamic-runner-allowed(reap, #415): the label is a workflow_call input, scoped by the calling repository
    #
    # Several labels arrive as a JSON array inside the string, because a
    # `type: string` input cannot carry a list. The `startsWith` guard keeps the
    # single-label case away from `fromJSON`, which would fail on a bare label.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 15
    # Serialised for the same reason the lane is: two runs deleting from the
    # same branch list would each act on a world the other is changing, and the
    # second one's reads are stale by definition.
    #
    # `cancel-in-progress: false`, never true. A cancelled reaper is a reaper
    # that deleted some branches and wrote no report.
    #
    # THE SUFFIX IS LEAD, NOT DECORATION, AND `branch-reaper` ON ITS OWN IS THE
    # ONE NAME THIS GROUP MAY NOT HAVE.
    #
    # A job cannot acquire a concurrency group that its OWN RUN already holds at
    # workflow level. It does not queue behind it and it does not cancel it —
    # GitHub fails the job at once, with no runner assigned, no steps and no
    # log, in about a second. Nothing anywhere names concurrency as the cause.
    #
    # The caller template published in `docs/branch-reaper.md` declared exactly
    # `concurrency: group: branch-reaper` at workflow level, because serialising
    # a destructive daily sweep is obviously right and the group has to be a
    # constant to do it. Every consumer copied it, so every consumer's run held
    # `branch-reaper` before this job asked for it. Measured 2026-08-26: nine of
    # nine consumer repositories failed the 04:17 sweep in one second, and this
    # repository — whose own caller happens to declare no workflow-level group —
    # succeeded eight seconds later on the same cron. Branch cleanup had never
    # run anywhere but here.
    #
    # `github.repository` is the CALLING repository, so this also keeps two
    # consumers from serialising against each other over a name they share by
    # coincidence rather than because they touch the same branches. The
    # `-callee` suffix is what a caller cannot collide with by copying the
    # obvious name.
    concurrency:
      group: branch-reaper-callee-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      # `contents: read` on the JOB and `Contents: write` on the App. The two
      # are not the same grant: this line bounds the built-in `GITHUB_TOKEN`,
      # which must never be able to delete a ref, so that there is exactly one
      # write path and it is the audited one.
      contents: read
    steps:
      - name: Resolve the callee's own commit
        id: callee
        env:
          READ_TOKEN: ${{ github.token }} # read-only: the caller file and a tag; never the gh CLI, which acts as the App
          IMPLEMENTATION_REPOSITORY: ${{ inputs.implementation-repository }}
          IMPLEMENTATION_REF: ${{ inputs.implementation-ref }}
          CALLEE_PATH: .github/workflows/branch-reaper.yml
        run: |
          set -euo pipefail
          die() {
            echo "::error title=reusable workflow::cannot pin this workflow to its own commit: $*. Refusing to fall back to the default branch (#1555)."
            exit 1
          }
          api=${GITHUB_API_URL:-https://api.github.com}
          fetch() { # <accept> <url>
            curl -sSfL --retry 3 --retry-delay 2 -H "Authorization: Bearer $READ_TOKEN" -H "Accept: $1" "$2"
          }
          ref=$IMPLEMENTATION_REF
          from="input implementation-ref"
          if [ -z "$ref" ]; then
            caller=${GITHUB_WORKFLOW_REF:-}
            if [ -z "$caller" ] || [ -z "${GITHUB_WORKFLOW_SHA:-}" ]; then die "GITHUB_WORKFLOW_REF or GITHUB_WORKFLOW_SHA is unset"; fi
            path=${caller#"$GITHUB_REPOSITORY"/}
            path=${path%%@*}
            [ "$path" != "${caller%%@*}" ] || die "GITHUB_WORKFLOW_REF '$caller' names no file in $GITHUB_REPOSITORY"
            body=$(fetch application/vnd.github.raw "$api/repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_WORKFLOW_SHA") ||
              die "cannot read the calling workflow $path at $GITHUB_WORKFLOW_SHA"
            refs=$(printf '%s\n' "$body" | awk -v want="$IMPLEMENTATION_REPOSITORY/$CALLEE_PATH" \
              -v self="$GITHUB_REPOSITORY" -v repo="$IMPLEMENTATION_REPOSITORY" \
              -v here="$GITHUB_WORKFLOW_SHA" -v local_path="./$CALLEE_PATH" '
              {
                line = $0
                sub(/^[ \t]*(-[ \t]+)?/, "", line)
                if (line !~ /^uses:[ \t]/) next
                sub(/^uses:[ \t]+/, "", line)
                gsub(/["\047]/, "", line)
                sub(/[ \t].*$/, "", line)
                if (line == local_path && tolower(repo) == tolower(self)) { print here; next }
                at = index(line, "@")
                if (at && tolower(substr(line, 1, at - 1)) == tolower(want)) print substr(line, at + 1)
              }' | sort -u)
            n=$(printf '%s' "$refs" | grep -c . || true)
            [ "$n" = 1 ] || die "$path at $GITHUB_WORKFLOW_SHA has $n distinct uses: refs for $IMPLEMENTATION_REPOSITORY/$CALLEE_PATH (need exactly 1): $(printf '%s' "$refs" | tr '\n' ' ')"
            ref=$refs
            from="$path"
          fi
          if [[ $ref =~ ^[0-9a-f]{40}$ ]]; then
            sha=$ref
          else
            sha=$(fetch application/vnd.github.sha "$api/repos/$IMPLEMENTATION_REPOSITORY/commits/$ref") ||
              die "cannot resolve ref '$ref' in $IMPLEMENTATION_REPOSITORY"
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || die "ref '$ref' resolved to '$sha', not a commit sha"
          echo "callee: implementation $IMPLEMENTATION_REPOSITORY@$sha, pinned by $from (ref $ref)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The ref is the commit the caller's `uses:` line pinned, resolved by the
      # step above. `github.job_workflow_sha` was meant to be that and is empty
      # in every run measured, so a checkout at it cloned the default branch (#1556).
      - name: Check out the reaper's implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.implementation-repository }}
          ref: ${{ steps.callee.outputs.sha }}
          persist-credentials: false

      # The fleet's self-hosted images do not ship `gh`, and the reaper is all
      # `gh api`. Here the consequence is milder than in the lane — a failed
      # read is a keep — but "kept everything, reported success" is still a
      # sweep that silently stopped sweeping. See `scripts/ci/ensure-gh.sh`.
      - name: Ensure the GitHub CLI
        run: bash scripts/ci/ensure-gh.sh

      - name: Mint the merge App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      # Every input reaches the script as an environment variable and none is
      # interpolated into the shell. `keep-patterns` is operator-supplied text
      # arriving in a job that can delete refs; an expression expanded into a
      # `run:` body is a shell injection there.
      - name: Run the reaper
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          MIN_AGE_DAYS: ${{ inputs.min-age-days }}
          MAX_DELETIONS: ${{ inputs.max-deletions }}
          KEEP_PATTERNS: ${{ inputs.keep-patterns }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: bash scripts/ci/branch-reaper.sh
