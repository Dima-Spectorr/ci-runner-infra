name: CI

# GitHub-hosted runners on purpose: this repo defines the self-hosted fleet, so
# it must not need the fleet to be healthy in order to fix the fleet.
on:
  # `ready_for_review` IS THE ONE THAT IS NOT DEFAULT, AND IT IS HERE FOR THE
  # AUTOMATED REVIEW.
  #
  # The default set is `opened, synchronize, reopened`. Marking a draft ready is
  # none of them, so without this a draft whose last push went green stays at
  # that same green sha when it becomes ready and produces no further CI
  # completion. `codex-review-self.yml` is dispatched by CI completions only —
  # deliberately, a sweep would re-read every open pull request forever — and
  # the review trigger declines to spend on a draft. The two rules meet in a
  # pull request that is green, ready, and never reviewed, which the merge lane
  # then holds for its grace and merges unreviewed.
  #
  # The cost is one extra run per draft that becomes ready. That is the same
  # work the pull request was going to need anyway, moved earlier.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A superseded push must release its slot rather than run to completion beside
# its replacement. Keyed on the branch so the second push to a pull request
# cancels the first.
#
# The fallback is `run_id`, NOT `github.ref`. On the `push` leg `head_ref` is
# empty, so a `ref` fallback puts every merge to main in one group and the
# second merge cancels the first commit's post-merge verification — the run
# whose whole purpose is to say whether main is healthy. A unique `run_id`
# gives each push its own group, so pull-request runs cancel and main runs
# never do.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # THE SHELL GATE IS ELEVEN JOBS AND AN AGGREGATE, not one job of eighty steps.
  # (Count the `shell-*` keys below rather than trusting this sentence — the
  # aggregate's second step fails if its `needs:` misses one of them, but no
  # check reconciles this number, so it is the thing here most able to go stale.)
  #
  # It was one job, and it ran for 8m38s while the other two finished in 8s and
  # 32s — eighty steps in a single line, on one four-core runner, with two of
  # them (`shell-runner-policy-mutation` and `shell-cache`) accounting for over
  # half the wall clock. Nothing about the work required that order: these are
  # independent gates over a checked-out tree.
  #
  # The split is by TOOL and by COST, so a job installs what it needs and
  # nothing else — `shellcheck`, PSScriptAnalyzer and Pester, packer, PyYAML —
  # instead of every job paying for every install.
  #
  # `Shell (syntax + drain rule)` still exists, as the aggregate at the bottom.
  # That name is a required status check here and is named in the merge lane's
  # `required-checks:`, so it is a CONTRACT, not a label: splitting the work
  # behind it must not change what the branch ruleset and the lane wait for.
  # A name the lane cannot find counts as MISSING, which stops the lane rather
  # than ungating it — the safe direction, and still a stopped lane.
  #
  # A job left out of that aggregate's `needs:` would run, fail, and be waited
  # for by nobody — green queue, red job. So the aggregate does not trust its own
  # list: it reads every `shell-*` job back out of this file and asserts the list
  # names all of them.
  shell-lint:
    name: Shell — lint (bash -n + shellcheck + workflow shell)
    runs-on: ubuntu-latest
    # Without this a hung job inherits GitHub's 360-minute default. On a
    # self-hosted pool that holds a host for six hours; here it merely wastes
    # the wait, but the rule is fleet-wide and starts at home.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: bash -n every script
        run: |
          set -euo pipefail
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      # SPLIT FROM `shellcheck`, AND BOTH HALVES BOUNDED. Installing the tool and
      # running it used to be one step whose only two commands are both quiet on
      # success, so a hang produced a step that printed a group header, nothing
      # else, and `The operation was canceled` fifteen minutes later. Twice, on
      # #203, with no way to tell from the log which half was stuck — apt
      # reaching an unreachable mirror and shellcheck looping look identical when
      # neither says anything. Two steps with an explicit `timeout` each cost
      # nothing and turn that into a named failure.
      - name: install shellcheck
        run: |
          set -euo pipefail
          timeout 300 sudo apt-get update -qq
          timeout 300 sudo apt-get install -y -qq shellcheck
          shellcheck --version

      - name: shellcheck
        run: |
          set -euo pipefail
          # SC1090/SC1091: sourced paths are resolved at runtime on the VM.
          # `-n1` so the log names the file it was reading when it stopped; the
          # per-file spawn cost is a few seconds across this tree and buys the
          # one fact a hang otherwise destroys.
          find . -name '*.sh' -print0 \
            | timeout 300 xargs -0 -n1 shellcheck -e SC1090,SC1091

      # THE TWO STEPS ABOVE, AND THESE TWO, SHARE A JOB BECAUSE THEY SHARE A
      # TOOL. `check-workflow-shell.sh` runs shellcheck and refuses to run
      # without it (WFS0), so it belongs wherever shellcheck is installed —
      # splitting it into the config-gate job below would cost a second apt
      # install to avoid a fail-closed gate, which is the worse trade.
      #
      # The two steps above read every `*.sh` in the tree and nothing else — and
      # a composite action's `run:` blocks are shell that lives in a `.yml`. The
      # pull request that added `.github/actions/playwright-ui/action.yml` had
      # two real shellcheck findings in its `.sh` files and several unread
      # `run:` blocks beside them, so the tool catches what this project cares
      # about; a whole class of shell was simply out of its reach. That shell
      # runs in CONSUMERS' repositories, on their warm hosts, which is the least
      # convenient place for a quoting bug to first appear.
      #
      # Fixtures first, as with every config gate here: `--allow-missing-shellcheck`
      # is deliberately NOT passed, so a runner without the tool fails the gate
      # instead of reporting a clean tree it never read.
      - name: workflow shell gate self-test
        run: bash scripts/ci/check-workflow-shell.sh --selftest

      - name: workflow shell gate
        run: bash scripts/ci/check-workflow-shell.sh

  shell-config-gates:
    name: Shell — config gates (packer, pipefail)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # And those sweeps read the shell as shell, which leaves one interpreter
      # question they cannot ask: a packer `inline` block is a script whose
      # shebang is set by `inline_shebang`, defaulting to `/bin/sh` — dash on
      # Ubuntu — no matter what `execute_command` says a line below it. A
      # `set -o pipefail` there is valid shell that dies on the guest, four
      # minutes into a forty-minute image build, and only for whoever builds an
      # image next; nobody's CI runs packer, so nothing else in this file would
      # ever have caught it.
      - name: packer inline shell gate self-test
        run: bash scripts/ci/check-packer-inline-shell.sh --selftest

      - name: packer inline shell gate
        run: bash scripts/ci/check-packer-inline-shell.sh

      # Same blind spot one layer up, in cloudbuild.yaml rather than in the
      # packer template: the gates above read the script as written, and the
      # bug that stopped every image build lived in what was left after Cloud
      # Build substituted into it. This one renders the step first.
      - name: image guard self-test
        run: bash scripts/ci/image-guard.selftest.sh

      # The shell sweeps above ask whether the interpreter will ACCEPT the
      # script. This one asks whether two options the script asked for will kill
      # it: under `set -e` and `pipefail` together, a pipeline ending in `head`
      # or `grep -q` exits 141 when the reader stops before the writer finishes.
      #
      # It is here rather than in a lint config because no linter has the rule —
      # shellcheck does not model `pipefail`, and the shape is idiomatic enough
      # that a grep for it is mostly false positives. And it is here rather than
      # nowhere because the fleet already paid for it: `docs/ci-optimization-
      # catalog.md` §5.2a described the defect and then declared the assignment
      # form "harmless", which is exactly the form that dequeued an IntegrateIT
      # pull request twice in one day, four times in thirty runs, after a
      # terraform install that had already verified its own checksum.
      #
      # A gate whose findings are mostly noise gets deleted, so the rule is
      # deliberately narrow: only where BOTH options are in effect, only the
      # bare assignment and bare-pipeline forms, never an `if` condition, never
      # a `local`, never a pipeline the author already guarded with `||`.
      - name: pipefail reader gate self-test
        run: bash scripts/ci/check-pipefail-readers.sh --selftest

      - name: pipefail reader gate
        run: bash scripts/ci/check-pipefail-readers.sh

      # "nobody's CI runs packer" is the sentence above, and it cost an image
      # build to finish reading. Two pull requests fixed the SAME provisioner
      # for the same reason within an hour, one inserting `inline_shebang`
      # before `inline` and one before `execute_command`. Different offsets, so
      # git merged them without a conflict, and every gate here stayed green
      # because each reads the file as SHELL — none of them parses it as HCL,
      # where `Attribute redefined` is unambiguous and immediate.
      #
      # So this repository's one deliverable was syntactically invalid on main
      # and nothing said so until a real build spent its queue time to report
      # it eighteen seconds in.
      #
      # `validate -syntax-only` is what makes this affordable: it parses, and it
      # does not need plugins, credentials, a var file or a build VM. Packer is
      # fetched pinned to `_PACKER_VERSION` from cloudbuild.yaml, bounded, so
      # the gate cannot become the unbounded fetch it exists to prevent.
      - name: install packer (pinned)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ver="$(grep -oP '_PACKER_VERSION:\s*"\K[0-9.]+' cloudbuild.yaml)"
          curl -fsSL --retry 3 --max-time 120 \
            -o /tmp/packer.zip \
            "https://releases.hashicorp.com/packer/${ver}/packer_${ver}_linux_amd64.zip"
          unzip -q -o /tmp/packer.zip -d /tmp/packer-bin
          /tmp/packer-bin/packer version

      # ONE TEMPLATE PER INVOCATION, not `validate packer/`.
      #
      # A directory argument is not "check each template in here". Packer merges
      # every *.pkr.hcl in the folder into ONE configuration, so the moment a
      # second template became a sibling of the first — the Windows image — the
      # shared variable names collided and this gate failed with `Duplicate
      # variable declaration` on two templates that are each perfectly valid.
      # The tempting fixes are both wrong: renaming the variables makes the two
      # templates gratuitously different, and moving one into a subdirectory
      # makes the directory argument quietly stop reading it, which is a gate
      # that passes because it looked at nothing.
      #
      # Reading nothing is a failure here for the same reason it is in every
      # other gate in this file: the loop below counts what it parsed and exits
      # non-zero when a rename or a move leaves it with no template.
      - name: packer parses
        run: |
          set -euo pipefail
          n=0
          for t in packer/*.pkr.hcl; do
            [ -f "$t" ] || continue
            echo "== $t"
            /tmp/packer-bin/packer validate -syntax-only "$t"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no packer template was parsed"; exit 1; }
          echo "parsed $n packer template(s)"

      # The image now scans itself and refuses to be created when the scan finds
      # something fixable at or above the floor. That refusal is a DECISION —
      # which findings block, which ignores are still live, what an unreadable
      # report means — and the only place it would otherwise be observable is
      # forty minutes into an image build that nobody's CI runs. So the decision
      # lives in a script with no grype and no image behind it, and the fixtures
      # exercise it here: a fixable critical, an unfixable one, a live ignore, an
      # ignore a day past its expiry, an unreadable report, and a report that
      # matched nothing at all — which is a failure, not a clean image.
      - name: image vulnerability verdict self-test
        run: bash scripts/ci/image-vuln-verdict.sh --selftest

  shell-powershell:
    name: Shell — PowerShell (analyzer + Pester)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The shell and workflow sweeps read `*.sh` and `run:` blocks, and are
      # blind to a `.ps1`. Windows hosts are driven by PowerShell, so the fleet is about to
      # grow code that no gate in this file can read. These three steps land one
      # pull request BEFORE the first `.ps1` does, so no window exists in which
      # unparsed, unlinted Windows code sits on main looking gated.
      #
      # The install reaches PSGallery over the network, so it carries a bound.
      # An unbounded fetch in a gate is the shape of the outage this repository
      # spends a whole self-test file preventing on the hosts; the gate itself
      # does not get an exemption.
      - name: install PSScriptAnalyzer (pinned)
        timeout-minutes: 5
        run: |
          pwsh -NoProfile -NonInteractive -Command \
            "Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force"

      - name: PowerShell gate self-test
        run: bash scripts/ci/powershell-gate.sh --selftest

      - name: PowerShell gate (parse + analyzer)
        run: bash scripts/ci/powershell-gate.sh

      # Parsing and linting are still READING. v5.1.4 passed every gate in this
      # file while every controller in the fleet died on its first tick, because
      # all of them read the controller's text and none of them ran it. So the
      # decidable half of the Windows path is written as side-effect-free
      # functions and RUN here — on ubuntu-latest, since this repository must
      # never need the fleet to be healthy in order to fix the fleet.
      #
      # Pinned and bounded for the same reason PSScriptAnalyzer is.
      - name: install Pester (pinned)
        timeout-minutes: 5
        run: |
          pwsh -NoProfile -NonInteractive -Command \
            "Install-Module Pester -RequiredVersion 6.1.0 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck"

      # The floor is the point of this step. A misplaced file, a rename, a
      # BeforeAll that throws during discovery — each of those yields a run that
      # discovers nothing, and a suite that discovers nothing reports success.
      # That is the exact shape of the failure the tests are here to prevent, so
      # it is asserted rather than trusted.
      #
      # Concretely: Pester discovers `*.Tests.ps1`, and on Linux that match is
      # case-sensitive. A file named `.tests.ps1` is a green build over a suite
      # that never ran. Raise the floor in the same pull request that adds tests.
      # Before Pester, and deliberately outside it. Pester reports a container
      # failure as one opaque line, so when the beacon file refuses to import
      # there is no way to tell a broken file from a broken test harness. This
      # step answers that question in plain pwsh, where the error is the error.
      # It is also the assertion behind the entry-point guard: dot-sourcing this
      # file must define functions and run nothing.
      - name: Windows scripts are dot-sourceable
        shell: pwsh
        run: |
          $p = './modules/ci-runner-host-pool/scripts/windows-beacon-publisher.ps1'
          Write-Output "1) InvocationName when dot-sourced, as the guard sees it"
          & { . $p; Write-Output "   imported inside a scriptblock" }
          Write-Output "2) dot-source at top level"
          . $p
          Write-Output "   Get-BeaconTimestamp -> $(Get-BeaconTimestamp)"
          Write-Output "   Get-BoundedDuration -> $(Get-BoundedDuration -Requested 0 -Minimum 20 -Maximum 600)"
          $b = './modules/ci-runner-host-pool/scripts/windows-host-startup.ps1'
          Write-Output "3) boot script imports and runs no phase"
          . $b
          Write-Output "   Test-ImageVersion 3/3 -> $(Test-ImageVersion -Marker '3' -Floor 3)"

      - name: Windows script tests (Pester)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.1.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'scripts/ci'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          $floor = 297
          Write-Output "pester: $($r.PassedCount) passed, $($r.FailedCount) failed, $($r.TotalCount) discovered"
          if ($r.TotalCount -lt $floor) {
            throw "Pester discovered only $($r.TotalCount) test(s), fewer than the $floor this suite is known to contain — the suite did not run, whatever the exit code says"
          }
          # A container-level failure -- BeforeAll throwing, a file that will not
          # dot-source -- is reported by Pester as one line and every test in the
          # file marked failed, which reads like thirteen bugs and is one. The
          # cause lives in the container's own ErrorRecord and nowhere else, so
          # it is printed rather than left for somebody to reproduce locally on a
          # machine that has no pwsh.
          foreach ($c in $r.Containers) {
            if (-not $c.Result -or $c.Result -eq 'Passed') { continue }
            Write-Output "--- container failed: $($c.Name)"
            foreach ($e in @($c.ErrorRecord)) {
              Write-Output ($e | Out-String)
              if ($e.ScriptStackTrace) { Write-Output $e.ScriptStackTrace }
              if ($e.Exception.InnerException) { Write-Output "inner: $($e.Exception.InnerException)" }
            }
          }
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }

  shell-decisions:
    name: Shell — controller decision rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Ahead of every decision rule below, because all of them run against a
      # row this parser produced. A dropped row is not a failure the fleet
      # reports: that pool simply stops being ticked, and its ONLY_UP autoscaler
      # holds its last size forever while every dashboard stays green.
      - name: pool-table self-test
        run: bash scripts/ci/pool-table.selftest.sh

      # The three ways one controller serving four pools can corrupt a pool it
      # is not currently ticking — a stale MIG template, another pool's state
      # markers, another pool's recycle budget — plus the pre-table controller
      # still booting. None of them is visible in a boot log.
      - name: multi-pool self-test
        run: bash scripts/ci/multi-pool.selftest.sh

      # The seam between a pool and the controller that serves it: a
      # `pool_descriptor` output on one side, a jq parser on the other, and
      # Terraform checking neither. A key the parser never reads is not an
      # error anywhere — the column it was meant to fill just takes its default.
      - name: controller module self-test
        run: bash scripts/ci/controller-module.selftest.sh

      - name: drain-decision self-test
        run: bash scripts/ci/drain-decision.selftest.sh

      # The only rule in the pool that deletes hosts on nobody's trigger, and
      # the only one whose wrong verdict is uniform: every host reads stale by
      # the same reasoning, so one bad template read cordons the entire fleet in
      # a single tick. Asserted here, not discovered there.
      - name: recycle-decision self-test
        run: bash scripts/ci/recycle-decision.selftest.sh

      # Reaping a registration is irreversible for a live slot, so the rule is
      # asserted here rather than discovered on the fleet.
      - name: orphan-decision self-test
        run: bash scripts/ci/orphan-decision.selftest.sh

      # Cancelling somebody's workflow run is irreversible in the same way, and
      # this rule is the only thing between a MIG listing that blipped and a
      # cancelled build. Most of its cases assert what must NOT happen.
      - name: pinned-job-decision self-test
        run: bash scripts/ci/pinned-job-decision.selftest.sh

      # The Windows half of the delete gate. Where the Linux rule reads an
      # answer the controller fetched itself, this one reads a value the HOST
      # published — so every failure of that publisher, its clock and the guest
      # attributes API is an input to the verdict rather than an exception
      # around it. Three of those failures look exactly like "idle" to a naive
      # implementation, and each deletes a machine that may be running a job.
      - name: beacon-decision self-test
        run: bash scripts/ci/beacon-decision.selftest.sh

      # The veto that stops the controller taking away a host a pull request is
      # still using. Both directions are asserted, and they are not symmetric: a
      # wrong `free:` deletes a host a run named by label -- taking the shared
      # database on it with it -- while a wrong `hold:` keeps one machine warm
      # until the hold lapses. The monotonic cases are the security ones; guest
      # attributes are writable by any process on the VM, so a co-tenant job can
      # publish a valid-but-expired hold over a live one.
      - name: pin-hold-decision self-test
        run: bash scripts/ci/pin-hold-decision.selftest.sh

      # The one rule in this directory that judges a pull request rather than a
      # machine, and the only one whose failure mode is a muted alert rather
      # than a lost job. It fires on a state every other surface reports as
      # healthy -- green, finished, and permanently outside the merge queue --
      # so a single false positive on somebody's work in progress is enough for
      # the signal to be filtered away and the next parked pull request to sit
      # for another three days. Hence a case list weighted towards silence.
      - name: parked-decision self-test
        run: bash scripts/ci/parked-decision.selftest.sh

      # The rule that says whether a project is still RECEIVING infrastructure,
      # and the only check here whose subject is the control plane rather than
      # the pool. Its failure mode is the worst shape available: a check that
      # reports green on a project it never read is indistinguishable from a
      # project that is fine, which is precisely the invisibility it was built
      # to end. So the case list drives every broken arm -- including the
      # sub-second submit refusal that writes no log at all -- and treats the
      # healthy state as one case rather than the whole set.
      - name: apply-decision self-test
        run: bash scripts/ci/apply-decision.selftest.sh

      # The same control plane, one layer down: whether the apply is allowed to
      # touch an alert policy at all. Updating one closes its open incidents and
      # the next evaluation re-opens and re-notifies, so the unconditional PATCH
      # this replaced mailed every currently-true condition once an hour, around
      # the clock, describing nothing that had changed. The comparison that
      # stops it is now the only thing between an operator's threshold edit and
      # a change that silently never deploys, so it is tested from both sides.
      - name: alert-policy idempotence self-test
        run: bash scripts/ci/alert-policy-idempotence.selftest.sh


      # A wrong verdict here does not degrade the pool, it silences it: the
      # watchdog restart kills the tick before its metrics flush, so a
      # mis-restarted controller publishes nothing at all while systemd reports
      # `active (running)`. Two of seven pools ran that way on 2026-08-14.
      - name: watchdog-decision self-test
        run: bash scripts/ci/watchdog-decision.selftest.sh

      # A bound that is not a bound: a call allowed to START inside the budget
      # spends its whole timeout beyond it, and a fixed alert threshold pages
      # for a wider watchdog window it knows nothing about. Both were review
      # findings on the restart-loop fix, both re-open the loop it closed.
      - name: demand-budget self-test
        run: bash scripts/ci/demand-budget.selftest.sh

      # v5.1.4 shipped a global replace that gave gh_token() and idle_seconds()
      # a variable belonging to collect_demand's scope. Under `set -u` the token
      # path died on every tick: all seven pools blind, scale-in suspended, and
      # every gate above green — because they all READ the controller text and
      # none of them RAN it. This one runs the functions.
      - name: controller-scope self-test
        run: bash scripts/ci/controller-scope.selftest.sh

      - name: demand-match self-test
        run: bash scripts/ci/demand-match.selftest.sh

  shell-host:
    name: Shell — host boot and slot lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: host-startup self-test
        run: bash scripts/ci/host-startup.selftest.sh

      # host-startup.selftest.sh is structural, and the slot-reset bug of
      # 2026-08-23 walked straight past it: the code said "recreate the
      # directory" and did, one level above the directory the runner chdirs
      # into. Every job the reset deliberately failed then failed the SLOT, and
      # nine of them across three hosts took the fleet down. This one extracts
      # the generated hook and runs it.
      - name: slot-reset workspace self-test
        run: bash scripts/ci/slot-reset-workspace.selftest.sh

      # And the same script's slot lifecycle, RUN rather than read. The gate
      # above is text: it asks whether a control is present and proves the
      # question can fail by deleting the control. That cannot see a property
      # that lives between three individually correct lines, which is what
      # condemned twelve of IntegrateIT's twenty-four slots on 2026-08-23 --
      # every structural assertion passed throughout the outage. This one
      # extracts slot-reset.sh and slot-sweep.sh exactly as a host writes them
      # and drives boot/started/completed against a real slot tree.
      #
      # It needs root, which is why it lives in the ubuntu-latest job and not
      # on the pool: the reset chowns a home and empties directories owned by
      # another uid, and as anyone else it would report a partial wipe as a
      # completed one. It FAILS rather than skips if it cannot get root.
      - name: slot lifecycle behaviour
        run: sudo -n bash scripts/ci/slot-lifecycle.behaviour.sh

  shell-infra:
    name: Shell — shared infra and Windows host boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The band's two constants live in two files in two languages, because
      # the network module is created once per project and deliberately does
      # not depend on the pools. A firewall span narrower than the DNAT range
      # fails as a hang, not as an error: the SYN is dropped and the client
      # waits out the job's timeout. This is what notices.
      - name: shared-infra-band self-test
        run: bash scripts/ci/shared-infra-band.selftest.sh

      # The fallback a consuming job takes when the anchor published no shared
      # stack — the common leg, not the rare one, since the anchor degrades
      # whenever another run already holds the host. Its interesting behaviour
      # is a retry loop around `docker run`, and the only other way to reach
      # that loop is to run a real workflow on a real host with a sibling slot
      # holding the port, which nobody can arrange on purpose.
      - name: shared-infra-db fallback self-test
        run: bash scripts/ci/shared-infra-db.selftest.sh

      # The Windows startup script is guarded twice, because the two harnesses
      # answer different questions. Pester (in the Windows job) executes the
      # functions and checks what they RETURN. This one reads the file as text
      # and checks what it must never CONTAIN — no firewall rule, no credential
      # written to instance metadata or guest attributes, no broker off loopback,
      # job hooks set on every slot unconditionally. A behavioural test cannot
      # express "this control was deleted and must not come back"; only a
      # mutation against the source can.
      - name: windows-host-startup self-test
        run: bash scripts/ci/windows-host-startup.selftest.sh

      # The Terraform half of the same boundary. `terraform validate` below
      # evaluates neither variable validation nor resource preconditions — both
      # are PLAN-time — so the module's OS axis has no other gate. What it
      # guards: a Linux pool still renders the key set it renders today, and
      # every refusal a Windows pool needs is reachable. A Windows instance
      # carrying `startup-script` runs no boot script at all and churns hosts at
      # full price while every metric reads "hosts running".
      - name: host-os guard self-test
        run: bash scripts/ci/host-os-guard.selftest.sh

  shell-cache:
    name: Shell — dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ALONE IN ITS OWN JOB, and the longest of them — which makes it the thing
      # that decides how long this pipeline takes. It runs 274 mutations
      # sequentially, about a hundred seconds. Every other job here finishes well
      # inside that, so shortening the pipeline further means splitting THIS
      # file's cases the way `check-runner-policy.selftest.sh` splits its own,
      # not rearranging anything around it.
      #
      # The dependency cache is the only layer here whose breakage produces no
      # error at all: a job with a misconfigured cache still passes, it just
      # re-downloads everything. That is how the image described itself as
      # carrying "pre-warmed caches" for five minor versions while the warm
      # script was a stub and no tool was pointed at the tree. The self-test also
      # guards the ISOLATION half — that the cache never becomes one tree several
      # slot users can write — which fails just as silently and much worse.
      - name: dependency cache self-test
        run: bash scripts/ci/shared-cache.selftest.sh

  shell-contracts:
    name: Shell — snapshots, brokers and identity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Windows half of the dependency-cache layer, and the same silence: a
      # build phase
      # that loses its bound, its reap or its two-job split still produces an
      # archive, and the archive is what every host in the pool unpacks as
      # SYSTEM. The Pester suite runs this script's pure functions; nothing but
      # this file checks that they are CALLED, or that the reap happens before
      # the tree is read.
      - name: Windows snapshot build-phase self-test
        run: bash scripts/ci/build-cache-snapshot.selftest.sh

      # Routing bug here = job code gets the HOST identity, which reads the
      # GitHub App key. Tested on every change, not only when the broker moves.
      - name: job credential broker self-test
        run: python3 scripts/ci/job-broker.selftest.py

      # The build cache is served TO job code, so its bug is the mirror of the
      # broker's: an upload that reached the store would let one pull request
      # hand every later build in that repository a tarball the build unpacks
      # into its own output tree. The rest of the suite covers the other half —
      # a server that is subtly wrong here presents as "cache enabled, build
      # slow", which is precisely the failure that went unnoticed for weeks.
      - name: turbo remote cache self-test
        run: python3 scripts/ci/turbo-cache.selftest.py

      # This rule decides whether a consuming repository runs CI at all, so a
      # wrong verdict is the one that merges untested code while reporting
      # green. Asserted here, in the repository that publishes it, rather than
      # discovered in the fourteen repositories that consume it.
      - name: lane-decision self-test
        run: bash scripts/ci/lane-decision.selftest.sh

      # The lane rule decides how much CI to run; this one decides whether to
      # run it AT ALL, by claiming a lane's inputs are byte-identical to a tree
      # already tested. A wrong verdict here is a green light over code nobody
      # tested — strictly worse than paying for the run, and invisible, because
      # the pull request looks like one whose checks passed. Every detector is
      # proved to fire on a fixture before this repository's own trees would be
      # believed.
      - name: suite-reuse-key self-test
        run: bash scripts/ci/suite-reuse-key.selftest.sh
      # The real guard is a variable `validation`, but terraform evaluates
      # module-input validation only at PLAN time — `terraform validate` below
      # passes a root that shares one account between hosts and controller. So
      # the properties that make the plan-time guard reachable are asserted
      # statically here instead.
      - name: identity split self-test
        run: bash scripts/ci/identity-split.selftest.sh
      # The apply identity is assumable from a GitHub Actions run, so whatever it
      # can do, a workflow file can do. Every permission error an unattended
      # apply hits argues for one more role, and that road ends at "can grant
      # itself owner" — reachable from CI, in a fleet that auto-merges on green.
      # Nothing else here would notice: validate, plan and apply all succeed.
      - name: apply identity self-test
        run: bash scripts/ci/apply-identity.selftest.sh

      # One unbounded socket stalls the controller's tick loop or a consumer's
      # oneshot poller permanently, and the demand metric keeps its LAST value
      # rather than going absent — so the pool stops scaling while every
      # dashboard still shows a number. Cost a windows pool 2h55m at targetSize
      # 0 on 2026-08-14. The reaper survived only because its author happened to
      # pass --max-time; this removes the dependence on habit.
      - name: bounded-calls self-test
        run: bash scripts/ci/bounded-calls.selftest.sh

      # `systemctl enable --now` is a no-op on a unit that is already running,
      # and the controller VM keeps its disk across a reset — so the old process
      # kept serving the pool while the new file sat on disk, with terraform,
      # the file hash and `systemctl status` all reporting success. Cost the
      # v5.1.0 rollout its first delivery on 2026-08-14.
      - name: installer-activation self-test
        run: bash scripts/ci/installer-activation.selftest.sh

      # THE MERGE LANE IS THE ONLY MERGE AUTOMATION HERE NOW.
      #
      # Three Mergify gates used to run at this point — the single-step queue
      # rule, the scope-coverage rule, and the nudge's structural test. All
      # three guarded a `.mergify.yml` this repository no longer has. A gate
      # that reads a file that does not exist is the vacuous pass those very
      # gates were written to prevent, so they go out with the config rather
      # than sit here reporting green over nothing.
      - name: merge-lane decision self-test
        run: bash scripts/ci/merge-lane-decision.selftest.sh
      - name: merge-lane structural self-test
        run: bash scripts/ci/merge-lane.selftest.sh

      # THE OTHER HALF OF THE LANE'S REVIEW GATE, AND THE HALF THAT SPENDS
      # MONEY.
      #
      # `codex-review-self.yml` is a `workflow_run` workflow, so like the lane
      # it cannot be exercised by the pull request that changes it — and unlike
      # the lane, the cost of it being wrong is billed to an account rather than
      # paid in waiting. A trigger that fired on `pull_request` would be the
      # vendor's automatic review this replaces, and would look completely
      # normal in the diff. This is the only thing that catches that.
      - name: codex-review self-test
        run: bash scripts/ci/codex-review.selftest.sh

      # The base-health names are a contract that spans two files with nothing
      # joining them. A name that matches no job counts as MISSING, and missing
      # does not halt — so a typo, or renaming the job that answers, fails
      # nothing and looks exactly like a working gate while the lane goes back
      # to merging onto an unverified base. It also reads the fallback the lane
      # reads: `base-health-checks` unset means `required-checks`, so a caller
      # that never opted in is checked too, which is the case most likely to be
      # naming a job that only ever runs on a pull request.
      - name: base-health contract self-test
        run: |
          # Same guard as the other PyYAML reader in this pipeline: the check
          # REFUSES to run without it rather than comparing two empty strings.
          python3 -c 'import yaml' 2>/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          }
          bash scripts/ci/check-base-health-contract.sh --selftest
      - name: base-health contract
        run: bash scripts/ci/check-base-health-contract.sh

      # The same shape one layer down: a contract spanning two files with
      # nothing joining them, whose breakage is silent. The controller writes
      # `<prefix>/ci_demand`; the hosts' autoscaler reads it. Split the prefix
      # and the MIG reports targetSize 0, isStable true, and every job queues
      # forever behind a pool that looks perfectly healthy.
      - name: metric-prefix agreement self-test
        run: bash scripts/ci/check-metric-prefix-agreement.sh --selftest
      - name: metric-prefix agreement
        run: bash scripts/ci/check-metric-prefix-agreement.sh

      # The guard the lane cannot be: the lane asks "may this merge now",
      # seconds before it does; the guard asks whether the branch is looking at
      # the current base and whether anyone else is rewriting the same files,
      # on open and on every push, while the author can still act on it. Its
      # driver is all `gh api` and is no more testable than the lane's, so the
      # rules live in pure functions and this is where they are exercised.
      - name: pr-guard decision self-test
        run: bash scripts/ci/pr-guard-decision.selftest.sh

      # The branch reaper, split the same way and for the same reason: a
      # scheduled workflow is dispatched from the default branch only, so these
      # two steps are the only thing that runs on the pull request that changes
      # it. The decision self-test is weighted the opposite way to the lane's —
      # nearly every case must NOT delete — because the failure being defended
      # against destroys commits rather than merging them.
      - name: branch-reaper decision self-test
        run: bash scripts/ci/branch-reaper-decision.selftest.sh
      - name: branch-reaper structural self-test
        run: bash scripts/ci/branch-reaper.selftest.sh

      # `ci_orphan_registrations_reaped` was published from the day the reaper
      # landed and never declared in the module output that dashboards and alert
      # policies are built from, so nothing looked at it. The reverse drift is
      # worse: `ci_job_startup_seconds` was declared and never implemented, so an
      # alert on it could never fire — and a policy that cannot fire reads as
      # healthy forever.
      - name: metric contract self-test
        run: bash scripts/ci/metric-contract.selftest.sh

      # The firewall now records where the pool connects out to, and a record
      # nobody reads is a cost with no benefit. This exercises the aggregation
      # against fixture log entries rather than a live project: the shape of a
      # firewall LogEntry is the thing most likely to be wrong, and discovering
      # that against a real pool costs a day of nobody noticing.
      - name: egress destinations self-test
        run: bash scripts/ci/egress-destinations.sh --selftest

      # The outcome series is the first one to carry a label the fleet does not
      # write itself: a workflow name, repository-authored, reaching a JSON body
      # built by concatenation. A single quote in one would not spoil one label
      # — it would make the whole request unparseable and drop every series in
      # that tick, `ci_demand` included, so the pool would stop scaling out
      # because somebody renamed a workflow.
      - name: outcome attribution self-test
        run: bash scripts/ci/outcome-attribution.selftest.sh

      # A stale checkout applied 2026-08-14 reverted Print-Server's runner infra
      # to the retired architecture and destroyed the App-key secret. The tree was
      # CLEAN — a failed `git pull` inside a loop left an old commit checked out —
      # and `prevent_destroy` did not fire, because a config that lacks the module
      # block lacks its lifecycle guard too. This gate keeps the apply wrapper's
      # two refusals honest: wrong commit, and identity-destroying plan.
      - name: tf-apply-guard self-test
        run: bash scripts/ci/tf-apply-guard.selftest.sh

      # A retry that never retries and a retry that never gives up both pass an
      # exit-status check, so this drives a fake terraform and asserts the CALL
      # COUNT as well: once when init is clean, three times for a reset, once
      # for a version constraint no retry can satisfy.
      - name: terraform init retry self-test
        run: bash scripts/ci/terraform-init-retry.sh --selftest

      # EVERY OTHER GATE IN THIS PIPELINE CHECKS THIS REPOSITORY. The four
      # outages that cost the most were all on the other side of the repository
      # boundary — pools pinned off, a lane never armed, a required check no
      # workflow emits, wedged queued runs hiding real demand — and each one is
      # invisible from inside the repository it affects, because a broken
      # repository looks exactly like an idle one. The fleet audit asks that
      # question, and it runs from a schedule on the default branch, so this
      # step is the only thing that exercises its rule on the pull request that
      # changes it.
      - name: fleet-audit decision self-test
        run: bash scripts/ci/fleet-audit-decision.selftest.sh

  shell-runner-policy:
    name: Shell — runner policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Which pool a job may claim. The fixtures first, same reason as above —
      # a workflow gate that reads no workflow reports clean.
      - name: runner policy self-test
        run: bash scripts/ci/check-runner-policy.sh --selftest

  shell-runner-policy-mutation:
    name: Shell — runner policy mutation ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # …and the fixtures' own proof. A fixture asserting "this workflow produces
    # RUNNER8" keeps passing while the detector behind it is weakened, so this
    # mutates the gate and asserts its fixture suite FAILS for each mutation.
    #
    # It used to run as a step AFTER `runner policy self-test`, on the reasoning
    # that a mutation "detected" by a suite that was already red asserts nothing.
    # That ordering is now inside the script instead of beside it: every shard
    # first runs an UNMUTATED copy of the gate and refuses to score a single case
    # unless that copy passes. The guarantee is the same one, made where it
    # cannot be reordered away — so this job no longer needs to follow anything.
    #
    # The case count is deliberately not written here: the script prints its own
    # and asserts a floor on it, and a number in prose beside a test that counts
    # itself is a second source of truth that goes stale — this comment said
    # "sixteen ways" while the file held twenty-five.
    #
    # WHY THIS IS A MATRIX. Each case is a full run of the gate's fixture suite,
    # and that suite spawns one `python3` per fixture — about seventeen seconds
    # of interpreter startup. Fanned across one runner's four cores the whole set
    # took three minutes ten, which was 37% of this pipeline. Sharded four ways
    # it is four runners' worth of cores instead of one.
    #
    # `strategy.job-total` is the LENGTH OF THE LIST BELOW, so the shard count is
    # written down exactly once. Add or remove a shard and the total follows; the
    # alternative — a literal `4` beside the list — goes stale by dropping the
    # last shard's mutations while every job still reports green.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: runner policy mutation self-test
        run: bash scripts/ci/check-runner-policy.selftest.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  shell-repo-gates:
    name: Shell — this repository's own gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # …and then this repository's own workflows. It publishes the rule, so it
      # is the first place the rule must hold. `--forks=allowed` is the strict
      # posture and this repository is PUBLIC, so it is also the true one.
      #
      # `--shared-infra` is deliberately NOT passed yet. This repository's own
      # workflows have not been consolidated onto an anchor, so turning the
      # rules on here would fail this pipeline on the commit that adds them —
      # and a gate whose first act is to redden its own repository is a gate
      # nobody adopts. It goes on in the pull request that does the
      # consolidation (phase 7 of docs/adr-pr-host-affinity.md); until then the
      # fixtures in `shell-runner-policy` and the mutations in
      # `shell-runner-policy-mutation` are what prove the rules work.
      - name: runner policy
        run: bash scripts/ci/check-runner-policy.sh --forks=allowed

      # …and the worked example seven repositories are about to copy. The
      # rules above cannot be turned on over THIS repository's workflows yet
      # (see the comment on the step before), so the example is where they are
      # exercised against a real file rather than an inline fixture. Clean is
      # only half of it: the check also mutates the example three ways and
      # asserts each is reported, because an example that trips nothing can
      # drift arbitrarily far from the contract while still reading green.
      - name: shared-infra worked example
        run: bash scripts/ci/check-shared-infra-example.sh

      # Whether a version is still supported. The rule is asserted here rather
      # than discovered on a fleet, because its wrong direction is a REPORT that
      # says nothing: `eol: false` in the upstream feed means "no end-of-life
      # date announced", and read as a boolean it marks every framework that
      # publishes no dates — React, and most of the rest — permanently clean.
      # A scan that always answers "fine" is indistinguishable from a healthy
      # fleet, which is exactly the state this rule was written to end.
      - name: support-window rule self-test
        run: bash scripts/ci/support-window-decision.selftest.sh

      # …and the scanner that feeds it, against a fixture repository and a
      # pinned copy of the feed. Hermetic on purpose: the live scan reads a
      # third-party API, and a gate that goes red because endoflife.date is
      # down is a gate that gets deleted.
      - name: support-window scanner self-test
        run: bash scripts/ci/scan-support-windows.selftest.sh

      # A browser suite is the one gate whose every mis-configuration is
      # invisible in the run's status: a committed `test.only` passes over one
      # test, a missing `globalTimeout` DEQUEUES the pull request instead of
      # failing it, and a `container:` tag drifted from the repository's
      # `@playwright/test` downloads ~2 GB the host already holds baked.
      # Fixtures only here — this repository builds the image, it has no suite.
      - name: e2e policy self-test
        run: bash scripts/ci/check-e2e-policy.sh --selftest

      # A moved tag on a popular action is arbitrary code on every pool in the
      # fleet, with no pull request in any consumer to review it.
      - name: action pins self-test
        run: bash scripts/ci/check-action-pins.sh --selftest

      - name: action pins
        run: bash scripts/ci/check-action-pins.sh

      # The other half of that rule. Pinning decides what code ARRIVES on a
      # pool; this decides what it may do once it runs. Omit `permissions:` and
      # a job does not get nothing — it gets the repository default, a value in
      # a web console that no reviewer of the workflow can see, and `read-write`
      # for every repository created before GitHub changed it. On a warm host
      # that token is readable by every step, including the install scripts of
      # every transitive dependency the job downloads.
      - name: workflow permissions self-test
        run: bash scripts/ci/check-workflow-permissions.sh --selftest

      - name: workflow permissions
        run: bash scripts/ci/check-workflow-permissions.sh

      # The README quickstart pinned v3.0.0 while the fleet ran v4.1.0 — the one
      # copy-pasteable line in the repo, three minor versions stale, because
      # nothing connected Markdown to a git tag. VERSION is that connection.
      # The documented `uses:` pins are now SHAs with a version comment (#351),
      # and the check proves the comment by resolving the tag it names. A
      # default checkout is depth 1 with no tags, so without this the check
      # would fail closed on every run — which is the right direction to fail,
      # but not a useful gate. Only the tag refs, and still shallow: the point
      # is to read what a tag POINTS AT, not to clone the history behind it.
      - name: fetch tags (the docs-pin check resolves them)
        run: git fetch --depth=1 origin '+refs/tags/*:refs/tags/*'

      - name: docs pins self-test
        run: bash scripts/ci/docs-pins.selftest.sh

      # Tags stopped at v5.3.2 while VERSION said v5.7.0 — four releases that
      # merged, passed every gate above, and could not be pinned by anyone,
      # because publishing the tag was a human step. docs-pins cannot see it:
      # it asserts the docs against VERSION, which was correct the whole time.
      - name: publish-tag self-test
        run: bash scripts/ci/publish-tag.selftest.sh

      # The other half of the same failure: publishing a tag nobody applies
      # changes nothing. v5.7.0 merged into nine repositories and reached one
      # pool — the one whose apply a person ran by hand. This asserts the
      # properties that let an apply run unattended, because an apply nobody
      # trusts is an apply somebody turns off, and then the fleet is back to a
      # laptop and a gitignored tfvars.
      - name: apply-runner-pool self-test
        run: bash scripts/ci/apply-runner-pool.selftest.sh

      # The same apply, triggered by the project's own Cloud Build instead of by
      # GitHub Actions — no federation, no principalSet, and no account a
      # workflow file can assume. What replaces those defences is the account
      # the consumer passes in and the plan the build printed, and both are one
      # persuasive edit from gone: "the CD account is missing, let the module
      # make one" and "Saved plan is stale, just -auto-approve it".
      - name: apply-trigger self-test
        run: bash scripts/ci/apply-trigger.selftest.sh

      # The cache warmer is the one job in this fleet whose every failure is
      # silent: it runs at 4am, nobody watches it, and a warmer that publishes
      # to the wrong prefix, publishes nothing, or is never fired all present as
      # "the cache is cold" — the same observable as a fleet that never had one.
      # These checks are structural for that reason: there is no run to inspect.
      - name: cache-warmer self-test
        run: bash scripts/ci/cache-warmer.selftest.sh

      # The browser image a pool BAKES and the one a consumer is told to RUN are
      # two different lines that must name one release. When they drift nothing
      # fails — every UI job just quietly downloads two gigabytes it was meant
      # to find warm, and the symptom is "browser tests are slow", which is the
      # most believable wrong explanation there is.
      - name: playwright pin self-test
        run: bash scripts/ci/check-playwright-pin.sh --selftest

      - name: playwright pin
        run: bash scripts/ci/check-playwright-pin.sh

  # THE NAME THE REST OF THE WORLD WAITS FOR.
  #
  # The branch ruleset's required-check list names this string, and so does
  # `merge-lane-self.yml`'s `required-checks:`. Both are outside this job and
  # neither is updated by editing it, so the name is pinned here and the work
  # moved behind it.
  #
  # `if: always()` is what makes it a gate rather than a formality. Without it
  # this job is SKIPPED when a dependency fails, and a skipped required check is
  # not a failed one: GitHub reports no conclusion, so the lane counts it as
  # MISSING and waits — correctly, and forever, until the in-flight budget
  # releases the pull request and says so.
  shell:
    name: Shell (syntax + drain rule)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - shell-lint
      - shell-config-gates
      - shell-powershell
      - shell-decisions
      - shell-host
      - shell-infra
      - shell-cache
      - shell-contracts
      - shell-runner-policy
      - shell-runner-policy-mutation
      - shell-repo-gates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every dependency, by name and result. `success` is the ONLY acceptable
      # one: `failure` and `cancelled` are obvious, and `skipped` is the quiet
      # one — a dependency that never ran asserted nothing, and treating it as
      # green is how a gate reports on work it did not do.
      - name: every shell job concluded green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          bad = {j: r["result"] for j, r in sorted(results.items()) if r["result"] != "success"}
          for job, outcome in sorted(results.items()):
              print("%9s  %s" % (outcome["result"], job))
          if bad:
              print()
              for job, result in bad.items():
                  print(f"::error::{job} concluded '{result}', not success")
              sys.exit(1)
          print(f"\nall {len(results)} shell job(s) green")
          PY

      # THE LIST AUDITS ITSELF.
      #
      # A new `shell-*` job that nobody adds to `needs:` above runs, fails, and
      # blocks nothing: this aggregate goes green without it and the merge queue
      # merges over a red check. That is a silent hole, and it is one `grep`
      # away from being impossible, so it is asserted rather than left to review.
      - name: the aggregate waits for every shell job in this file
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys

          watched = set(json.loads(os.environ["RESULTS"]))
          declared = set(
              re.findall(
                  r"^  (shell-[a-z0-9-]+):$",
                  open(".github/workflows/ci.yml", encoding="utf-8").read(),
                  re.MULTILINE,
              )
          )
          missing = declared - watched
          stale = watched - declared
          for job in sorted(missing):
              print(f"::error::job '{job}' is not in this aggregate's needs: — it would fail without blocking anything")
          for job in sorted(stale):
              print(f"::error::this aggregate needs '{job}', which no longer exists in this file")
          if missing or stale:
              sys.exit(1)
          print(f"the aggregate covers all {len(declared)} shell-* job(s)")
          PY

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - run: terraform fmt -check -recursive

      - name: validate every module standalone
        run: |
          set -euo pipefail
          for m in modules/*/; do
            echo "== $m"
            # `init` talks to the registry once per module, so a transient reset
            # anywhere in the loop fails a required check on a clean pull
            # request. Retried, and only for failures a retry can fix (#271).
            bash scripts/ci/terraform-init-retry.sh "$m"
            # `validate` is offline. Its failures are always real, so it stays
            # unwrapped — a retry here would only hide genuine breakage.
            terraform -chdir="$m" validate
          done

  genericity:
    name: Genericity (no customer or repo literals)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This scan used to be an inline `grep` over `*.tf`, `*.sh` and `*.hcl`,
      # and it was blind to the file class with the widest blast radius:
      # documentation and workflow YAML. `docs/onboarding-a-repository.md`
      # exists to be copy-pasted into fourteen other repositories, so a literal
      # that reaches it propagates BY DESIGN — while a region literal in a
      # workflow `env:` decides what CI actually does. Neither was read.
      #
      # (This comment was itself the gate's first catch: it named the region it
      # was describing, in a `.yml`, and failed the job. Left as a note, since a
      # gate whose first finding is its own justification is a gate that works.)
      #
      # The inline version also wrote the GitHub owner into its own pattern, in
      # a public repository. The script derives it from `GITHUB_REPOSITORY`
      # instead, so the literal is gone and the rule self-adjusts in a fork.
      #
      # The rule that makes the widening safe rather than merely noisy is in the
      # script: Markdown is scanned inside ``` fences only. A literal in prose
      # is an incident reference and stays; a literal in a fence is something
      # somebody will paste.
      #
      # Fixtures first — the inline version could not have any, which is the
      # second reason it moved.
      - name: generic literals gate self-test
        run: bash scripts/ci/check-generic-literals.sh --selftest

      - name: generic literals gate
        run: bash scripts/ci/check-generic-literals.sh
