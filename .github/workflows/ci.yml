name: CI

# GitHub-hosted runners on purpose: this repo defines the self-hosted fleet, so
# it must not need the fleet to be healthy in order to fix the fleet.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: Shell (syntax + drain rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n every script
        run: |
          set -euo pipefail
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1090/SC1091: sourced paths are resolved at runtime on the VM.
          find . -name '*.sh' -print0 | xargs -0 shellcheck -e SC1090,SC1091

      - name: drain-decision self-test
        run: bash scripts/ci/drain-decision.selftest.sh

      # Reaping a registration is irreversible for a live slot, so the rule is
      # asserted here rather than discovered on the fleet.
      - name: orphan-decision self-test
        run: bash scripts/ci/orphan-decision.selftest.sh

      - name: demand-match self-test
        run: bash scripts/ci/demand-match.selftest.sh

      - name: host-startup self-test
        run: bash scripts/ci/host-startup.selftest.sh

      # Routing bug here = job code gets the HOST identity, which reads the
      # GitHub App key. Tested on every change, not only when the broker moves.
      - name: job credential broker self-test
        run: python3 scripts/ci/job-broker.selftest.py

      # The real guard is a variable `validation`, but terraform evaluates
      # module-input validation only at PLAN time — `terraform validate` below
      # passes a root that shares one account between hosts and controller. So
      # the properties that make the plan-time guard reachable are asserted
      # statically here instead.
      - name: identity split self-test
        run: bash scripts/ci/identity-split.selftest.sh

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform fmt -check -recursive

      - name: validate every module standalone
        run: |
          set -euo pipefail
          for m in modules/*/; do
            echo "== $m"
            terraform -chdir="$m" init -backend=false
            terraform -chdir="$m" validate
          done

  genericity:
    name: Genericity (no customer or repo literals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no hardcoded org, project, region or repo
        run: |
          set -uo pipefail
          # This module is consumed by several repositories in more than one
          # organisation, region and project. A literal here is a fork waiting
          # to happen — it is exactly how the vendored predecessor drifted.
          pattern='me-west1|europe-west1|mot-[a-z0-9-]+|Dima-Spectorr|\.gov\.il|gs://'
          if grep -rInE "$pattern" \
               --include='*.tf' --include='*.sh' --include='*.hcl' \
               . ; then
            echo "::error::customer/project/region literal in a shared module"
            exit 1
          fi
          echo "clean"
