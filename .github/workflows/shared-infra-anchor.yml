# =============================================================================
# shared-infra-anchor — the anchor of the three-rule contract, published ONCE
#
# Rule 1 of docs/ci-pr-shared-infra.md is "one host per pull-request run", and
# the mechanism is a job that lands on a host, pins it, brings the stack up and
# publishes where it went. That job is ~75 lines of pin admission, band
# arithmetic and degrade branches, and every one of those lines is IDENTICAL in
# every repository that adopts the contract. Only five things differ: the pool
# label, the TTL, the compose file, the migration command, and the hosted image
# a fork falls back to.
#
# Seven copies of seventy-five lines is seven copies of every future fix. The
# gate in this repository already says so out loud, in RUNNER7's marker comment:
# "the fleet's whole premise is ONE reusable workflow in ci-runner-infra called
# by every repository instead of nine drifting copies". This is that workflow.
#
# WHAT A CONSUMER WRITES
#
#   # remote-reusable-allowed(Dima-Spectorr/ci-runner-infra/.github/workflows/shared-infra-anchor.yml, #248): the fleet's own published anchor
#   # shared-infra-owner(anchor): brings up ci/compose.yaml on this run's Linux host
#   jobs:
#     anchor:
#       uses: Dima-Spectorr/ci-runner-infra/.github/workflows/shared-infra-anchor.yml@00d3aec8adc67275fe2189c635bdf25cf66bc696 # v5.46.0
#       with:
#         repo-label: ExampleRepo
#         migrate: ./scripts/db-migrate.sh "$DATABASE_URL"
#
# …and then `runs-on: ${{ fromJSON(needs.anchor.outputs.runs-on) }}` on every
# fleet Linux job, exactly as before. The consumer's side of the contract is
# unchanged; only the anchor's body moved.
#
# The two markers are not boilerplate to be tidied away. The first is RUNNER7:
# this gate cannot read another repository's file, so a human accepting the
# callee's runner scope and timeouts is recorded rather than assumed. The
# second is RUNNER10: an owner whose bring-up happens behind a `uses:` is
# invisible to a YAML reader, and "one stack per run" is only countable if each
# owner says so.
#
# WHERE THE VERSION COMES FROM
#
# A 40-character SHA with a version comment beside it — the shape
# `check-action-pins.sh` PIN1 demands, because that gate is published by this
# repository and copied into every consumer.
#
# This block used to say `@v5`, the floating major, and that advice could not be
# followed: PIN1 rejects a tag outright, so the call as documented failed the
# gate in the first three repositories that adopted it (#351). The rule is
# right and the example was wrong. A tag is a pointer its owner may move, this
# workflow executes on hosts holding a GCP identity, and a floating major is the
# most movable pointer there is — it moves on every release.
#
# Nor `@main`: the anchor talks to host-side contracts — `ci-pin-hold`,
# `CI_SHARED_INFRA_ADDR`, the port band — which are versioned with the pool
# image, and `@main` lets it move ahead of the hosts it is talking to.
#
# The comment is not decoration. PIN1 requires it precisely so Dependabot can
# rewrite the pin, which answers the objection the old text raised against an
# exact version: a SHA does NOT age silently in a consumer, because a pull
# request arrives when it moves. `docs-pins.selftest.sh` holds up this end —
# every documented pin must be a SHA whose comment names a real tag of this
# repository, in the major it currently publishes.
#
# WHY IT RUNS NOWHERE IN THIS REPOSITORY
#
# It has no trigger but `workflow_call`, so GitHub never runs it here, and it
# could not: this repository defines the self-hosted fleet and must not need the
# fleet to be healthy in order to fix the fleet. What runs here on every pull
# request is `scripts/ci/check-shared-infra-example.sh`, which drives the gate
# over `docs/examples/pr-shared-infra.yml` — the consumer side of this call.
# =============================================================================

name: Shared infra anchor

on:
  workflow_call:
    inputs:
      repo-label:
        description: >-
          The repository-scoping label RUNNER1 requires, e.g. `IntegrateIT`.
          Becomes the fourth element of the pool this anchor claims and of the
          array it publishes.
        required: true
        type: string
      pin-ttl:
        description: >-
          How long the host holds itself against drain and recycle. A DEADLINE
          measured from the moment the anchor runs, so it must outlive the WHOLE
          run and not just this job — set it above the sum of your longest
          chain of `timeout-minutes`, not above any single one.
        required: false
        default: 90m
        type: string
      compose-file:
        description: >-
          Compose file brought up on the pinned host. EMPTY means pin-only:
          rule 1 without rule 2, for a repository that has no shared
          infrastructure, or for a lane of one that needs none. `pg` is then
          published empty, which is the same statement a degrade makes, so a
          consumer does not have to tell the two apart.
        required: false
        default: ci/compose.yaml
        type: string
      compose-project:
        description: >-
          Compose project name. Empty means `pr-<number>`, which is what makes
          two stacks for one pull request (two workflows, or a re-run) two
          COMPLETE stacks rather than one half-migrated shared one.
        required: false
        default: ''
        type: string
      migrate:
        description: >-
          A shell command run once, after the stack is up, with `DATABASE_URL`
          and `PG_PORT` in the environment. Empty means the stack needs no
          migration step. This is the line the contract exists for: it used to
          run in every job that needed a database.
        required: false
        default: ''
        type: string
      hosted-runner:
        description: >-
          The GitHub-hosted image a fork pull request, and only a fork pull
          request, degrades onto.
        required: false
        default: ubuntu-latest
        type: string
      # There is deliberately NO `timeout-minutes` input. `timeout-minutes:
      # ${{ inputs.timeout-minutes }}` is an expression this repository's own
      # RUNNER6 refuses, and it is right to: an expression that lands on 360 or
      # more bounds nothing, and nothing in a static read can rule that out. The
      # bound is fixed at 15 below. A repository whose bring-up genuinely needs
      # longer should open an issue rather than fork the file — the fix belongs
      # here, once, for everyone.

    outputs:
      runs-on:
        description: >-
          A JSON ARRAY, consumed with `fromJSON`. Appending an empty label to a
          literal list yields a label that matches no runner, which queues until
          cancelled; emitting the whole array makes "unpinned" a SHORTER array.
        value: ${{ jobs.anchor.outputs.runs-on }}
      addr:
        description: >-
          The address a sibling slot or a Windows host reaches the stack at.
          Never localhost — see RUNNER11. Empty on any degrade branch.
        value: ${{ jobs.anchor.outputs.addr }}
      pg:
        description: >-
          The band port Postgres is published on. Empty on a degrade, and empty
          in pin-only mode — both say "there is no shared stack", which is the
          only thing a consumer has to act on.
        value: ${{ jobs.anchor.outputs.pg }}
      pinned:
        description: >-
          `1` when this run holds a host and every consumer job will land on it,
          `0` on every degrade — a fork, a host that predates the contract, or a
          host another run already holds. `runs-on` already carries that fact,
          but only as the LENGTH of an array, which a caller cannot branch on
          without re-parsing it.
        value: ${{ jobs.anchor.outputs.pinned }}
      slots:
        description: >-
          How many of this run's jobs can run AT ONCE when pinned: the host's
          slot count minus the one `--reserve-slot` holds for the shared stack.
          `0` when unpinned, which means "not host-limited" rather than "no
          capacity" — an unpinned run is scheduled across the whole pool.

          WHAT THIS IS FOR. A caller that fans out (test shards, matrix legs)
          has to choose a width, and the only correct width depends on something
          only the anchor knows. Pinned, more legs than free slots is strictly
          worse than fewer: the surplus legs queue behind their own siblings on
          one host, so the run gets longer, not shorter. Unpinned, that ceiling
          does not exist and a width chosen for it leaves the pool idle.

          Measured on this fleet: 14 of 15 consecutive runs of one repository's
          PR check landed UNPINNED (they spread across 3-6 hosts), while their
          shard count was a compile-time constant justified by the pinned case.
          Every one of those runs was serialised against a limit that was not
          there.
        value: ${{ jobs.anchor.outputs.slots }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Deliberately UNPINNED: whichever host it lands on becomes this run's host.
  # It is the infrastructure owner as well, because the anchor occupies a slot
  # either way and a job that only echoes a variable is a slot spent on nothing.
  #
  # It must END. Outputs do not reach `needs.<job>.outputs.*` until the job
  # completes, so an owner that lingers to "keep the stack up" is an owner whose
  # consumers can never start. The slot is held host-side instead, by
  # `--reserve-slot`.
  # ---------------------------------------------------------------------------
  # RUNNER5. This job's `runs-on` is an expression BY CONSTRUCTION and always
  # will be: the pool label is a `workflow_call` input, which is the whole point
  # of publishing the anchor once instead of seven times. The value is scoped by
  # the calling repository, whose own gate run checks the label it passes, and
  # the fork branch keeps outside code on a hosted image regardless.
  #
  # Declared per-job rather than with `--allow-dynamic-runner`, which would
  # excuse every dynamic job in this repository at once — including one a later,
  # unrelated change adds — from a CI invocation the reviewer of this job never
  # sees. Every other workflow here is GitHub-hosted and must stay checkable.
  # dynamic-runner-allowed(anchor, #248): the pool label is a workflow_call input, scoped by the calling repository
  anchor:
    name: Shared infra (anchor)
    # RUNNER4, and NOT `if: fork == false`.
    #
    # A guard in the anchor's `if:` looks equivalent and is not: a job that
    # `needs:` a SKIPPED job is itself skipped, so guarding the anchor skips
    # every consumer with it and a fork pull request gets no CI at all. The
    # failure is silent, because a skipped required check is not a red one.
    #
    # So the anchor routes instead of skipping. On a fork it runs on a
    # GitHub-hosted image, which is what keeps fork code off a credentialed warm
    # host, and it publishes a hosted array so the whole run degrades together.
    #
    # `format` and not string concatenation because `runs-on` must be a LIST for
    # a self-hosted pool, and the only way to build one from an input is to
    # build the JSON and read it back. A `repo-label` that is not a plain label
    # fails `fromJSON` here, loudly, rather than silently matching no runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && inputs.hosted-runner || fromJSON(format('["self-hosted","linux","gcp","{0}"]', inputs.repo-label)) }}
    # Fixed, not an input — see the note in the input block above.
    timeout-minutes: 15
    outputs:
      runs-on: ${{ steps.up.outputs.runs-on }}
      addr: ${{ steps.up.outputs.addr }}
      pg: ${{ steps.up.outputs.pg }}
      pinned: ${{ steps.up.outputs.pinned }}
      slots: ${{ steps.up.outputs.slots }}
    steps:
      # The CALLER's repository at the caller's sha: in a `workflow_call` the
      # `github` context is the caller's event, so this is the tree whose
      # compose file and migration script the steps below run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: up
        env:
          # Every input reaches the shell as an environment variable and never
          # as `${{ }}` spliced into a command line. Interpolation happens
          # before the shell sees the script, so a value containing a quote or a
          # newline would be shell syntax rather than data — and `repo-label` on
          # a fork pull request is the one value an outsider can influence the
          # evaluation of.
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          REPO_LABEL: ${{ inputs.repo-label }}
          CI_PIN_TTL: ${{ inputs.pin-ttl }}
          COMPOSE_FILE_IN: ${{ inputs.compose-file }}
          COMPOSE_PROJECT_IN: ${{ inputs.compose-project }}
          MIGRATE: ${{ inputs.migrate }}
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Every exit below publishes all five outputs. `addr` and `pg` are
          # published EMPTY on a degrade rather than omitted, so a consumer that
          # reads them gets an obviously-blank value instead of the literal
          # string `null` that a missing output yields.
          #
          # `pinned` and `slots` are NOT defaulted by the caller for the same
          # reason: `needs.anchor.outputs.slots` on a path that forgot to set it
          # is the string `null`, and `fromJSON(null)` fails inside whatever job
          # consumed it, long after the anchor went green. Both are therefore
          # arguments here rather than optional, so a new degrade branch cannot
          # be added without stating what it means for a fan-out.
          publish() { # <runs-on-json> <addr> <pg> <pinned:0|1> <slots>
            {
              printf 'runs-on=%s\n' "$1"
              printf 'addr=%s\n' "$2"
              printf 'pg=%s\n' "$3"
              printf 'pinned=%s\n' "$4"
              printf 'slots=%s\n' "$5"
            } >> "$GITHUB_OUTPUT"
          }

          # The concurrency a pinned run actually gets. `CI_HOST_SLOTS` is set
          # by the host at boot beside `CI_HOST_LABEL`; one slot is held by
          # `--reserve-slot` for the shared stack and is not available to jobs.
          #
          # Floored at 1 rather than reported as 0: a single-slot host is a
          # legitimate, if unusual, pool configuration, and 0 is the value that
          # means "unpinned, not host-limited" — a caller that read 0 here would
          # fan out as if it had the whole pool while holding one machine.
          free_slots() {
            local s="${CI_HOST_SLOTS:-}"
            case "$s" in
              ''|*[!0-9]*) printf '1'; return 0 ;;
            esac
            [ "$s" -gt 1 ] && printf '%s' "$((s - 1))" || printf '1'
          }

          # The pool, unpinned. Built with jq so the label is DATA: a printf
          # template would put an unescaped `"` straight into the JSON, and the
          # consumer's `fromJSON` would fail in a job that never named the
          # value.
          pool="$(jq -cn --arg l "$REPO_LABEL" '["self-hosted","linux","gcp",$l]')"

          # A fork pull request runs entirely on GitHub-hosted runners: no warm
          # host, no pin, and no shared stack. A suite that needs the stack has
          # to bring up its own throwaway service on this leg, or not run on
          # forks.
          if [ "${IS_FORK:-false}" = "true" ]; then
            publish "$(jq -cn --arg r "$HOSTED_RUNNER" '[$r]')" "" "" 0 0
            echo "::notice::fork pull request — the whole run stays on hosted runners"
            exit 0
          fi

          # Set by the host at boot. Absent means this host predates the
          # contract: degrade to unpinned scheduling, do not fail. A gate that
          # bricks every run on an old host is a gate that gets reverted.
          if [ -z "${CI_HOST_LABEL:-}" ]; then
            publish "$pool" "" "" 0 0
            echo "::notice::host predates the affinity contract — running unpinned"
            exit 0
          fi

          # A port outside the band resolves on this slot's own loopback and
          # NOWHERE else, which fails later, in the Windows job, as "connection
          # refused" with nothing nearby to read. Assert it here instead.
          : "${CI_SHARED_INFRA_ADDR:?host is too old for this contract — needs the port-band boot}"
          pg=$(( CI_SHARED_INFRA_PORT_MIN + 0 ))
          [ "$pg" -le "$CI_SHARED_INFRA_PORT_MAX" ] || { echo "band exhausted"; exit 1; }

          # READ THE ANSWER. `ci-pin-hold` is an admission decision, not a
          # request: it exits 0 either way and says `pinned=0` when another run
          # already holds this host. Publishing the label anyway pins every
          # consumer to a host somebody else owns — the exact contention this
          # mechanism exists to prevent.
          #
          # `--reserve-slot` is what keeps the stack alive after this job ends.
          if [ "$(ci-pin-hold --run "$GITHUB_RUN_ID" --ttl "$CI_PIN_TTL" --reserve-slot \
                    | sed -n 's/^pinned=//p')" != 1 ]; then
            publish "$pool" "" "" 0 0
            echo "::notice::another run holds this host — running unpinned"
            exit 0
          fi

          pinned="$(jq -cn --arg l "$REPO_LABEL" --arg h "$CI_HOST_LABEL" \
                      '["self-hosted","linux","gcp",$l,$h]')"

          # PIN-ONLY. An empty `compose-file` means this run wants rule 1 and
          # not rule 2: the host is pinned and every job lands together, but
          # nothing is brought up.
          #
          # Two real cases, and without this neither could adopt the contract at
          # all. A repository with no shared infrastructure would have to invent
          # a compose file to get host affinity. And a repository whose lane
          # model has a docs-only lane wants the pin for the jobs that still run
          # and no database for the shards that do not — which it selects with
          # an expression on this input.
          #
          # `pg` is published EMPTY, exactly as on a degrade, because the
          # statement both make is the same one: there is no shared stack here.
          # A consumer using `shared-infra-db` therefore falls back on its own
          # leg without needing to know which of the two happened.
          if [ -z "$COMPOSE_FILE_IN" ]; then
            publish "$pinned" "$CI_SHARED_INFRA_ADDR" "" 1 "$(free_slots)"
            echo "::notice::pinned ${CI_HOST_LABEL} with no shared stack — compose-file is empty"
            exit 0
          fi

          COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_IN:-}"
          [ -n "$COMPOSE_PROJECT_NAME" ] || COMPOSE_PROJECT_NAME="pr-${PR_NUMBER}"
          export COMPOSE_PROJECT_NAME
          PG_PORT="$pg" docker compose -f "$COMPOSE_FILE_IN" up -d --wait

          # Migrate and seed ONCE, in a child shell rather than `eval`, so a
          # failing migration is a failing step and not a mangled trap.
          if [ -n "$MIGRATE" ]; then
            DATABASE_URL="postgres://ci@127.0.0.1:${pg}/app" PG_PORT="$pg" \
              bash -c "$MIGRATE"
          fi

          publish "$pinned" "$CI_SHARED_INFRA_ADDR" "$pg" 1 "$(free_slots)"
