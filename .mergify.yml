# The merge queue for this repository — the baseline it publishes, applied here.
#
# docs/ci-merge-queue-baseline.md is the fleet's copy-in configuration, and this
# repository had none of it: no queue, no auto-merge, no branch protection. Its
# pull requests were merged by hand. That is the shape the baseline exists to
# remove, and shipping it from a repository that does not run it is how a
# baseline stops being true.
#
# Mergify was installed and idle here, which reads as a configured queue
# declining to act and was in fact no queue at all: `Mergify Merge Protections`
# reported `neutral` with "No merge protections matched" on every pull request,
# and nothing about that says "nothing will ever queue this".

# ONE CI RUN PER PULL REQUEST.
#
# Mergify re-checks a queued pull request IN PLACE — on its own branch, reusing
# the run that already happened — only when the queue is serial (this key),
# unbatched, free of check retries, and the CI is SINGLE-STEP, which its schema
# defines as `merge_conditions` being empty or IDENTICAL to `queue_conditions`.
# Anything else is validated on a throwaway draft pushed to
# `mergify/merge-queue/<sha>`, where every `pull_request` workflow runs a second
# time for every pull request that merges.
#
# This key is TOP-LEVEL. Inside a queue rule Mergify rejects the whole file
# (`Extra inputs are not permitted`) and the queue then fails CLOSED: every pull
# request sits unmergeable behind a red check whose reason is a configuration
# error rather than anything about the branch.
merge_queue:
  max_parallel_checks: 1

  # THE THIRD NUMBER, added 2026-08-19. Inert at width 1 — with one check in
  # flight there is nothing concurrent to schedule — and written anyway, because
  # this is the setting the whole fleet held by SILENCE rather than by decision.
  # Fourteen repositories inherited `serial` without one of them declaring it,
  # and the one repository above width 1 was therefore buying a STACK: entry 2's
  # draft carried entry 1's commits, so a dequeue at the front threw away
  # everything behind it and each of those restarted cold.
  #
  # Whoever raises the width above 1 here must edit a line that already exists,
  # and read docs/ci-merge-queue-baseline.md#scheduling-mode-the-third-number
  # before doing it: `parallel` requires a scope map that covers the repository
  # TOTALLY, because an unmatched pull request carries the empty scope set,
  # which overlaps nothing and therefore runs beside everything.
  #
  # `isolated` is banned outright — it removes the dependency between batches
  # entirely, so two entries that pass alone and conflict together both merge.
  # check-mergify-scopes.sh rejects it.
  mode: serial

queue_rules:
  - name: default
    merge_method: squash

    # ONE CONDITION LIST, ANCHORED AND REUSED — read before splitting it.
    #
    # `merge_conditions` below is this same YAML node, not a second list that
    # happens to agree with it. Two lists that match today drift the next time a
    # check is added to one of them, and the drift is silent: the queue keeps
    # merging, each pull request merely pays a second full CI run.
    queue_conditions: &gate
      - base = main
      - -draft
      - -conflict
      # The three CI checks. All three run on every pull request with no path
      # filter and no draft gate, so none of them can skip and leave the queue
      # waiting for a conclusion that never comes.
      #
      # `Shell (syntax + drain rule)` is no longer one job: the shell gate is ten
      # parallel jobs behind an AGGREGATE of that name, which is why the name did
      # not change when the work behind it was split. Name the aggregate here,
      # never the jobs it waits for — this list and the branch ruleset's required
      # checks are two copies of the same three strings, and a list that grows a
      # row per job has to be edited in two places outside this repository every
      # time the split changes. The aggregate reports `success` only when all ten
      # do, and it runs `if: always()` so a failed dependency reddens it rather
      # than skipping it.
      - check-success = "Shell (syntax + drain rule)"
      - check-success = "Terraform (fmt + validate)"
      - check-success = "Genericity (no customer or repo literals)"

    merge_conditions: *gate

    batch_size: 1

    # Pinned. Unset, it inherits an undeclared vendor default of roughly 42
    # minutes, so a hung job surfaces as a silent dequeue rather than a red
    # check. Every job here is `ubuntu-latest` shell and terraform validate,
    # well inside this.
    checks_timeout: 30 min

# WHAT PUTS A PULL REQUEST INTO THE QUEUE.
#
# Not a `pull_request_rules` queue action: that action's `conditions:` are a
# third list, different by construction since it has to carry `base`/`-draft`
# itself, and a third list is the two-step shape described above.
#
# `auto_merge_conditions` is the supported replacement — it supersedes the
# deprecated `queue_rules[].autoqueue`. It carries the base/draft facts only;
# the checks live once, in the anchored list, which is what decides when a
# queued pull request embarks. An empty list here would match nothing, and a
# `base` no queue rule admits would queue into a rule that cannot take it —
# both leave pull requests green and unmerged with no red check to say why.
merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions:
    - base = main
    - -draft
    - -conflict

# WHO MAY SAY `@mergifyio refresh` — the other half of
# `.github/workflows/mergify-nudge.yml`, and useless without it.
#
# Mergify is event-driven, and a missed `check_run.completed` webhook leaves a
# fully green pull request sitting on "your merge queue conditions are under
# evaluation" until a periodic re-evaluation minutes later. Measured here on
# 2026-08-23: 8m55s, 11m06s, 17m24s and 20m01s of idle time between the last
# green check and Mergify acting, against 13-14 seconds when Mergify reacts to
# an event it generated itself. `mergify-nudge` posts the refresh that clears
# it.
#
# It posts as `github-actions[bot]`, which is NOT a repository collaborator. The
# default restriction on `refresh` is `sender-permission >= write`, GitHub
# answers that question about the bot with something less than write, and
# Mergify then discards the command in SILENCE — no reply, no reaction, nothing
# in the thread to distinguish "ignored" from "the stall was going to end
# anyway". This block is what admits it.
#
# Widening it to a bot is not widening much: `refresh` re-evaluates the
# conditions that are already written down. It cannot approve, bypass, queue or
# merge, so the worst a hostile refresh achieves is making Mergify re-read the
# truth sooner.
#
# Declaring the key REPLACES the default rather than adding to it, so EVERY arm
# of the default has to be restated here or it is silently taken away. That is
# two arms, not one. The second — a pull request's author may refresh their own
# fork pull request — was left out when this block was first written, on the
# reasoning that nothing here depends on it and that guessing at a clause's
# spelling is how a `.mergify.yml` becomes invalid, which fails the queue CLOSED
# for every open pull request at once. The caution was sound; the conclusion was
# not. The spelling is published (`sender = {{author}}` and the boolean
# `from-fork` attribute), so restating it is not a guess — and "nothing here
# depends on it" was a judgement about this repository made on behalf of an
# outside contributor, which is not ours to make. Dropping an arm of an upstream
# default is a permission taken away in silence.
#
# It is a backstop, not the only route: the nudge DOES reach fork pull requests,
# because the callee resolves them from `commits/<sha>/pulls` rather than from
# the run payload (whose `pull_requests` is empty for a fork). The arm is what
# the author is left with when the nudge itself is the thing that is broken.
commands_restrictions:
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - and:
              - sender = {{author}}
              - from-fork
          - sender = github-actions[bot]
