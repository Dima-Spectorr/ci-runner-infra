# Builds the golden CI host image.
#
# Runs on Cloud Build, never on a workstation — a local image build saturates
# the machine, and the artifact must come from a reproducible, auditable
# builder rather than from whoever happened to run it.
#
# One image serves every repository and every pool. Substitutions below carry
# only WHERE to build and WHICH version to stamp; nothing here can make the
# image specific to a repository, customer or region.
#
# NORMALLY NOTHING TYPES THIS. `modules/ci-host-image-trigger` wires a Cloud
# Build trigger that runs this file on every merge to main and passes the
# substitutions from terraform, so the image is a build artifact of a merge
# rather than of whoever remembered the flags. See
# docs/applying-runner-infra.md. The command below stays the way to build an
# image OUT OF BAND — a warm-cache variant, a bisect, a one-off — and when it
# is used, _IMAGE_VERSION must be passed explicitly: the trigger's
# `g$SHORT_SHA` is expanded by Cloud Build only for a triggered build, and is
# literal text here.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --project=<project> \
#     --region=<region> \
#     --gcs-source-staging-dir=gs://<bucket-in-an-allowed-location>/source \
#     --substitutions=_ZONE=<zone>,_SUBNETWORK=<subnet>,_IMAGE_VERSION=v3-0-0
#
# --region and --gcs-source-staging-dir are NOT optional on an estate with
# constraints/gcp.resourceLocations. Without them gcloud stages the source to
# the `us` multi-region and runs the build there, and the API rejects the
# submission outright:
#
#   HTTPError 412: 'us' violates constraint 'constraints/gcp.resourceLocations'
#
# That failure arrives before a single step runs, which is the good case — the
# same constraint applied to the IMAGE is what _IMAGE_STORAGE_LOCATION below
# exists to prevent, and that one fails only after the whole build has run.
#
# A cache-warmed image adds one more:
#
#     --substitutions=...,_WARM_CACHE_SCRIPT=warm-cache/playwright.sh
#
# and, because a warmed image is substantially larger, a distinct
# _IMAGE_FAMILY so pools tracking the toolchain-only family do not silently
# inherit the extra gigabytes.

substitutions:
  _ZONE: ""
  _NETWORK: ""
  _SUBNETWORK: default
  # Must match the tag the project's IAP-SSH firewall rule targets, or the
  # tunnel to the (external-IP-less) build VM cannot be established.
  _NETWORK_TAG: ci-runner
  _PACKER_VERSION: "1.11.2"
  _IMAGE_VERSION: ""
  _IMAGE_FAMILY: ci-runner-host
  # Image STORAGE location. Empty lets GCE pick a multi-region, which
  # constraints/gcp.resourceLocations rejects — after the whole build has run.
  _IMAGE_STORAGE_LOCATION: ""
  _RUNNER_VERSION: 2.336.0
  # Optional path (in this repo) to a cache-warming script for the image.
  _WARM_CACHE_SCRIPT: ""

options:
  logging: CLOUD_LOGGING_ONLY
  # Packer drives a build VM; the builder itself needs no muscle.
  machineType: E2_HIGHCPU_8

steps:
  - id: guard
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # An unversioned image cannot be pinned by a consumer, and an image no
        # consumer can pin is how a fleet ends up running N different hosts.
        [ -n "${_IMAGE_VERSION}" ] || { echo "_IMAGE_VERSION is required"; exit 1; }
        [ -n "${_ZONE}" ] || { echo "_ZONE is required"; exit 1; }
        [ -n "${_NETWORK_TAG}" ] || { echo "_NETWORK_TAG is required (IAP firewall target tag)"; exit 1; }
        # Required, not optional: leaving it to GCE picks a multi-region that
        # gcp.resourceLocations rejects, and it rejects it at the END of the
        # build, after every provisioner has already run.
        [ -n "${_IMAGE_STORAGE_LOCATION}" ] || { echo "_IMAGE_STORAGE_LOCATION is required (e.g. the build region)"; exit 1; }

  # Runs on the gcloud builder, NOT on hashicorp/packer: the build VM has no
  # external IP, so Packer connects over an IAP tunnel, and Packer shells out to
  # `gcloud compute start-iap-tunnel` to open it. The packer image has no gcloud,
  # so that tunnel can never open there. Packer is fetched as a binary instead.
  - id: packer
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        curl -fsSL -o /tmp/packer.zip \
          "https://releases.hashicorp.com/packer/${_PACKER_VERSION}/packer_${_PACKER_VERSION}_linux_amd64.zip"
        # python3, not unzip: the gcloud builder ships no unzip, and apt-getting
        # one on every image build is a network dependency for nothing.
        python3 -c "import zipfile;zipfile.ZipFile('/tmp/packer.zip').extractall('/usr/local/bin')"
        chmod +x /usr/local/bin/packer
        cd packer
        packer init ci-host-image.pkr.hcl
        packer build \
          -var "project_id=$PROJECT_ID" \
          -var "zone=${_ZONE}" \
          -var "network=${_NETWORK}" \
          -var "subnetwork=${_SUBNETWORK}" \
          -var "network_tags=[\"${_NETWORK_TAG}\"]" \
          -var "image_family=${_IMAGE_FAMILY}" \
          -var "image_storage_locations=[\"${_IMAGE_STORAGE_LOCATION}\"]" \
          -var "image_version=${_IMAGE_VERSION}" \
          -var "runner_version=${_RUNNER_VERSION}" \
          -var "warm_cache_script=${_WARM_CACHE_SCRIPT}" \
          ci-host-image.pkr.hcl

  - id: report
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud compute images describe "${_IMAGE_FAMILY}-${_IMAGE_VERSION}" \
          --project="$PROJECT_ID" \
          --format="value(name,status,diskSizeGb)"
        echo "Pin this exact name in the pool's `image` variable — not the family."

timeout: 3600s
