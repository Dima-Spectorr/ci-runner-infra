# Builds a golden CI host image — Linux by default, Windows with
# `_HOST_OS=windows`.
#
# Until 2026-08-29 it built the Linux template and only the Linux template, in
# both `packer init` and `packer build`, and `ci-host-image-trigger` names this
# file and nothing else. `ci-runner-host-pool` has supported `host_os =
# "windows"` end to end since #76 — so the module was complete, the image it
# needs had no way to be produced, and no Windows pool had ever booted a host in
# any project in the fleet (#543). `_HOST_OS` is that missing half.
#
# Runs on Cloud Build, never on a workstation — a local image build saturates
# the machine, and the artifact must come from a reproducible, auditable
# builder rather than from whoever happened to run it.
#
# One image serves every repository and every pool. Substitutions below carry
# only WHERE to build and WHICH version to stamp; nothing here can make the
# image specific to a repository, customer or region.
#
# NORMALLY NOTHING TYPES THIS. `modules/ci-host-image-trigger` wires a Cloud
# Build trigger that runs this file on every merge to main and passes the
# substitutions from terraform, so the image is a build artifact of a merge
# rather than of whoever remembered the flags. See
# docs/applying-runner-infra.md. The command below stays the way to build an
# image OUT OF BAND — a warm-cache variant, a bisect, a one-off — and when it
# is used, _IMAGE_VERSION must be passed explicitly. Left empty, the `guard`
# step derives `g<short sha>` from the commit — and a hand-typed submit has no
# commit, so it refuses rather than stamping something ambiguous.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --project=<project> \
#     --region=<region> \
#     --gcs-source-staging-dir=gs://<bucket-in-an-allowed-location>/source \
#     --substitutions=_ZONE=<zone>,_SUBNETWORK=<subnet>,_IMAGE_VERSION=v3-0-0
#
# and for the Windows image, which must carry its own family — a family points
# at its newest member, so one family holding both kernels hands whichever pool
# applies next the wrong one, and `guard` refuses the pairing:
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --project=<project> \
#     --region=<region> \
#     --gcs-source-staging-dir=gs://<bucket-in-an-allowed-location>/source \
#     --substitutions=_HOST_OS=windows,_IMAGE_FAMILY=ci-runner-host-win,\
# _ZONE=<zone>,_SUBNETWORK=<subnet>,_IMAGE_VERSION=v1-0-0,_IMAGE_STORAGE_LOCATION=<region>
#
# --region and --gcs-source-staging-dir are NOT optional on an estate with
# constraints/gcp.resourceLocations. Without them gcloud stages the source to
# the `us` multi-region and runs the build there, and the API rejects the
# submission outright:
#
#   HTTPError 412: 'us' violates constraint 'constraints/gcp.resourceLocations'
#
# That failure arrives before a single step runs, which is the good case — the
# same constraint applied to the IMAGE is what _IMAGE_STORAGE_LOCATION below
# exists to prevent, and that one fails only after the whole build has run.
#
# A cache-warmed image adds one more:
#
#     --substitutions=...,_WARM_CACHE_SCRIPT=warm-cache/playwright.sh
#
# and, because a warmed image is substantially larger, a distinct
# _IMAGE_FAMILY so pools tracking the toolchain-only family do not silently
# inherit the extra gigabytes.

substitutions:
  # WHICH golden image this build produces. `linux` builds
  # packer/ci-host-image.pkr.hcl; `windows` builds
  # packer/ci-host-image-win.pkr.hcl. Defaulted to linux so every trigger that
  # existed before this substitution did keeps building exactly what it built.
  #
  # One config rather than two files, because the halves that differ are the
  # template name and its variable list — everything above and below them (the
  # version guard, the IAP-tunnelled packer fetch, the family/version report) is
  # the same build, and a second copy of it is a second place to fix the next
  # thing `guard` learns. The halves that DO differ are branched explicitly in
  # `packer` below rather than papered over with a shared variable list: the
  # Windows template has no `vuln_fail_on` and produces no scan artifacts, and
  # packer rejects a `-var` the template does not declare.
  _HOST_OS: linux
  # Windows only, and it is not the same number as _IMAGE_VERSION. The version
  # names the ARTIFACT; the contract version is what the boot script asserts
  # against the pool's `windows_image_min_version`, so it moves only when the
  # image changes something a host depends on. Ignored for a Linux build.
  _IMAGE_CONTRACT_VERSION: "1"
  _ZONE: ""
  _NETWORK: ""
  _SUBNETWORK: default
  # Must match the tag the project's IAP-SSH firewall rule targets, or the
  # tunnel to the (external-IP-less) build VM cannot be established.
  _NETWORK_TAG: ci-runner
  _PACKER_VERSION: "1.11.2"
  _IMAGE_VERSION: ""
  _IMAGE_FAMILY: ci-runner-host
  # Image STORAGE location. Empty lets GCE pick a multi-region, which
  # constraints/gcp.resourceLocations rejects — after the whole build has run.
  _IMAGE_STORAGE_LOCATION: ""
  _RUNNER_VERSION: 2.336.0
  # Optional path (in this repo) to a cache-warming script for the image.
  _WARM_CACHE_SCRIPT: ""
  # Severity floor at which a FIXABLE vulnerability in the finished image stops
  # the build. See `vuln_fail_on` in packer/ci-host-image.pkr.hcl for why the
  # default is critical rather than high.
  _VULN_FAIL_ON: critical
  # Where the SBOM and scan report are published. Empty keeps them in the build
  # log only — which is enough to read once and useless three months later, when
  # the question is "was CVE-X in the image that pool is pinned to". Point it at
  # a bucket in an allowed location and the answer becomes a file lookup.
  _SBOM_BUCKET: ""

options:
  logging: CLOUD_LOGGING_ONLY
  # Packer drives a build VM; the builder itself needs no muscle.
  machineType: E2_HIGHCPU_8
  #
  # NO `dynamicSubstitutions` HERE, DELIBERATELY, AND IT WAS TRIED. The version
  # this build stamps used to come from the trigger as `g$SHORT_SHA` — one
  # substitution referenced inside another's value, which resolves only under
  # that option. Two measurements, both against this file's own trigger:
  #
  #   build `68004298`  no option    `_IMAGE_VERSION` reached step 0 as the
  #                                  literal `g$SHORT_SHA`, contradicting the
  #                                  documented "for a build invoked by a
  #                                  trigger it is always set to true"
  #   build `97eeb41d`  option on    identical. Setting it in the build config
  #                                  does not reach a substitution the TRIGGER
  #                                  supplies; by then the value is fixed.
  #
  # Those were the trigger's only two builds, so the image pipeline had never
  # produced an image — invisible because nothing downstream goes looking for a
  # version that should exist. The nesting is gone rather than made to work:
  # `SHORT_SHA` is a built-in substitution, always defined, and referencing it
  # directly inside a step (below) needs no option and no vendor promise.

steps:
  - id: guard
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # SINGLE QUOTES, and they carry the whole point. Cloud Build pastes a
        # substitution's value into this script as text, so a value that still
        # holds a `$` is handed to bash to expand a SECOND time. That is how
        # this step reported `SHORT_SHA: unbound variable` — a shell error
        # about a name that is not a shell variable at all. Single-quoted, the
        # value is inert whatever it contains, and the check below is what
        # reports on it.
        IMAGE_VERSION='${_IMAGE_VERSION}'
        SHORT_SHA='${SHORT_SHA}'
        HOST_OS='${_HOST_OS}'
        IMAGE_FAMILY='${_IMAGE_FAMILY}'
        ZONE='${_ZONE}'
        NETWORK_TAG='${_NETWORK_TAG}'
        IMAGE_STORAGE_LOCATION='${_IMAGE_STORAGE_LOCATION}'
        # WHERE THE DEFAULT VERSION IS DECIDED — here, in a step, and not in the
        # trigger. A step's text is substituted directly, so `${SHORT_SHA}` two
        # lines up is the commit and nothing has to resolve it twice.
        #
        # `g` and not the bare sha: the image is `<family>-<version>`, the
        # version is the only part a human reads to tell two images apart, and a
        # suffix starting with a digit is indistinguishable from a truncated
        # version string. `g` is git's own marker for an abbreviated object name
        # (`git describe` prints `v1.2.3-4-gabc1234`) and it guarantees the
        # suffix starts with a letter, which a GCE image name requires.
        if [ -z "$$IMAGE_VERSION" ]; then
          # Empty only for a build with no commit — an out-of-band
          # `gcloud builds submit`, which must say which version it is stamping.
          # An unversioned image cannot be pinned by a consumer, and an image no
          # consumer can pin is how a fleet ends up running N different hosts.
          [ -n "$$SHORT_SHA" ] || {
            echo "_IMAGE_VERSION is required: this build has no SHORT_SHA to derive one from,"
            echo "so it was not invoked by a trigger. Pass _IMAGE_VERSION explicitly."
            exit 1
          }
          IMAGE_VERSION="g$$SHORT_SHA"
        fi
        # A caller-pinned version with a `$` in it never resolved. Non-empty, so
        # every -n check passes, and what it reaches is `image_name` — the build
        # spends forty minutes and creates an image genuinely called
        # `ci-runner-host-g$SHORT_SHA`, which the next consumer to pin a version
        # cannot tell from a deliberate name.
        case "$$IMAGE_VERSION" in
          *\$$*)
            echo "_IMAGE_VERSION is '$$IMAGE_VERSION' — a substitution in it was never resolved."
            echo "Nesting one substitution inside another does not work here (see options above)."
            echo "Pass a literal _IMAGE_VERSION, or leave it empty and let this step derive one."
            exit 1
            ;;
        esac
        # THE SAME REFUSAL ci-runner-host-pool MAKES AT PLAN TIME, made here at
        # build time, and for the same reason: a family points at its NEWEST
        # member, so one family holding both a Linux and a Windows image hands
        # whichever pool applies next the wrong kernel — and the guest agent's
        # response to that mispairing is to run no boot script at all, which
        # looks like a host that booted fine and never registered.
        #
        # Checked here rather than left to packer, because packer would build
        # for forty minutes first and only then publish the image under the
        # wrong family, at which point the family is already poisoned.
        case "$$HOST_OS" in
          linux)
            case "$$IMAGE_FAMILY" in
              *-win|*-win-*|*windows*)
                echo "_HOST_OS is linux but _IMAGE_FAMILY is '$$IMAGE_FAMILY'."
                echo "A family holding both kernels hands the next pool the wrong one."
                exit 1
                ;;
            esac
            ;;
          windows)
            case "$$IMAGE_FAMILY" in
              ci-runner-host-win*) ;;
              *)
                echo "_HOST_OS is windows but _IMAGE_FAMILY is '$$IMAGE_FAMILY'."
                echo "ci-runner-host-pool resolves a Windows pool by matching"
                echo "'ci-runner-host-win' in the image name, so an image published"
                echo "under any other family cannot be named by one."
                exit 1
                ;;
            esac
            ;;
          *)
            echo "_HOST_OS is '$$HOST_OS'; it must be 'linux' or 'windows'."
            exit 1
            ;;
        esac
        [ -n "$$ZONE" ] || { echo "_ZONE is required"; exit 1; }
        [ -n "$$NETWORK_TAG" ] || { echo "_NETWORK_TAG is required (IAP firewall target tag)"; exit 1; }
        # Required, not optional: leaving it to GCE picks a multi-region that
        # gcp.resourceLocations rejects, and it rejects it at the END of the
        # build, after every provisioner has already run.
        [ -n "$$IMAGE_STORAGE_LOCATION" ] || { echo "_IMAGE_STORAGE_LOCATION is required (e.g. the build region)"; exit 1; }
        # LAST, after every check: handed on as a file rather than re-derived,
        # because three later steps name the version and three copies of the
        # logic above are three chances for the image to be published under a
        # name the scan report does not use. Written only once this step has
        # decided the build may proceed, so the file's existence means the
        # version in it is the agreed one.
        printf '%s' "$$IMAGE_VERSION" > /workspace/image_version
        echo "image version: $$IMAGE_VERSION"

  # Runs on the gcloud builder, NOT on hashicorp/packer: the build VM has no
  # external IP, so Packer connects over an IAP tunnel, and Packer shells out to
  # `gcloud compute start-iap-tunnel` to open it. The packer image has no gcloud,
  # so that tunnel can never open there. Packer is fetched as a binary instead.
  - id: packer
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Decided by `guard`, not re-derived. See the note there.
        IMAGE_VERSION="$$(cat /workspace/image_version)"
        curl -fsSL -o /tmp/packer.zip \
          "https://releases.hashicorp.com/packer/${_PACKER_VERSION}/packer_${_PACKER_VERSION}_linux_amd64.zip"
        # python3, not unzip: the gcloud builder ships no unzip, and apt-getting
        # one on every image build is a network dependency for nothing.
        python3 -c "import zipfile;zipfile.ZipFile('/tmp/packer.zip').extractall('/usr/local/bin')"
        chmod +x /usr/local/bin/packer
        # Packer downloads the SBOM and scan report into here (see provisioner
        # 12). Created up front rather than relied on: a download destination
        # that does not exist is a provisioner failure, at the end of a
        # forty-minute build.
        mkdir -p image-scan
        cd packer
        # WHICH TEMPLATE. `guard` has already refused every _HOST_OS that is not
        # one of these two, so this needs no third branch — but it is a `case`
        # rather than a ternary so that adding one is an edit here and not a
        # silent fallthrough to Linux.
        case '${_HOST_OS}' in
          windows) TEMPLATE=ci-host-image-win.pkr.hcl ;;
          *)       TEMPLATE=ci-host-image.pkr.hcl ;;
        esac
        packer init "$$TEMPLATE"
        # $$ throughout: Cloud Build resolves `$name` as a substitution and
        # rejects the build config outright when the name is not one it knows,
        # so a plain shell variable here fails before a step ever runs. `$$`
        # is the documented escape and reaches the shell as a single `$`.
        #
        # The variables the two templates share, and then the ones only one of
        # them declares. Split rather than merged, because packer FAILS on a
        # `-var` naming a variable the template does not declare — so handing
        # the Windows template `vuln_fail_on` would not be harmlessly ignored,
        # it would end the build before the first provisioner.
        set -- \
          -var "project_id=$PROJECT_ID" \
          -var "zone=${_ZONE}" \
          -var "network=${_NETWORK}" \
          -var "subnetwork=${_SUBNETWORK}" \
          -var "network_tags=[\"${_NETWORK_TAG}\"]" \
          -var "image_family=${_IMAGE_FAMILY}" \
          -var "image_storage_locations=[\"${_IMAGE_STORAGE_LOCATION}\"]" \
          -var "image_version=$$IMAGE_VERSION" \
          -var "runner_version=${_RUNNER_VERSION}" \
          -var "warm_cache_script=${_WARM_CACHE_SCRIPT}"
        if [ '${_HOST_OS}' = windows ]; then
          set -- "$$@" -var "image_contract_version=${_IMAGE_CONTRACT_VERSION}"
        else
          set -- "$$@" -var "vuln_fail_on=${_VULN_FAIL_ON}"
        fi
        rc=0
        packer build "$$@" "$$TEMPLATE" || rc=$$?

        # PUBLISHED HERE, NOT IN A LATER STEP, and that is the whole point.
        #
        # A blocking vulnerability finding aborts `packer build`, and a Cloud
        # Build step that exits non-zero ends the build — every step after it is
        # skipped. So a publish step of its own would run on exactly the builds
        # whose report nobody needs, and never on the ones where the report IS
        # the output. The exit code is held and re-raised below instead.
        cd ..
        # …of a LINUX build. The Windows template runs no scanner and downloads
        # no artifacts, so image-scan/ is empty and every line below would
        # report its own absence: an unmatched glob into `gcloud storage cp`, a
        # missing verdict.txt, two warnings that describe a build working
        # exactly as designed. Skipped outright instead — a warning that fires
        # on every green build is how a fleet learns to stop reading warnings.
        #
        # The gap is real and is NOT hidden by skipping it: a Windows image
        # ships with no SBOM and no vulnerability verdict, which is a smaller
        # promise than the Linux one makes and has to be read as such.
        if [ '${_HOST_OS}' = windows ]; then
          echo "no SBOM or scan report: the Windows template runs no scanner (see packer/ci-host-image-win.pkr.hcl)"
          exit $$rc
        fi
        # Packer's directory download puts the tree under its own basename, so
        # the artifacts land in image-scan/ci-image-scan/ rather than in
        # image-scan/. Flatten before publishing: the extra path segment reached
        # the bucket, and `cat image-scan/verdict.txt` below found nothing on
        # every build so far — the one line an operator reads to learn whether
        # the image may ship was `cat: ... No such file or directory`.
        #
        # Guarded rather than assumed. This is packer's behaviour today, not a
        # documented contract, and a build must not start failing because a
        # future packer flattens it for us.
        #
        # `find -mindepth 1 -maxdepth 1`, not `mv dir/*`: a glob skips dotfiles,
        # so one `.something` in the download would be left behind, `rmdir`
        # would fail, and the extra path segment this exists to remove would
        # reach the bucket anyway — quietly, because both halves were `|| true`.
        # `rmdir` stays deliberately un-forced: it is the assertion that the
        # move actually emptied the directory, and `rm -rf` here would delete
        # scan artifacts on the day it did not.
        if [ -d image-scan/ci-image-scan ]; then
          # Not allowed to abort the step: `set -e` is on, and the publish and
          # the held packer exit code both live below this point. A tidy-up
          # failing must not be what discards the scan report.
          find image-scan/ci-image-scan -mindepth 1 -maxdepth 1 -exec mv -t image-scan/ {} + ||
            echo "WARNING: flattening image-scan/ci-image-scan failed" >&2
          rmdir image-scan/ci-image-scan ||
            echo "WARNING: image-scan/ci-image-scan is not empty after flattening; the extra path segment will reach the bucket" >&2
        fi
        if [ -n "${_SBOM_BUCKET}" ]; then
          gcloud storage cp -r image-scan/* \
            "gs://${_SBOM_BUCKET}/ci-host-image/${_IMAGE_FAMILY}-$$IMAGE_VERSION/" \
            --project="$PROJECT_ID" || echo "WARNING: publishing the SBOM failed; it is still in this log"
          echo "SBOM + scan: gs://${_SBOM_BUCKET}/ci-host-image/${_IMAGE_FAMILY}-$$IMAGE_VERSION/"
        else
          echo "WARNING: _SBOM_BUCKET is unset — the SBOM and scan report exist only in this build's workspace, which is discarded."
        fi
        # Re-printing the verdict must not be what fails the build — it is
        # already in the packer output above. But it is no longer silent about
        # not finding it; that silence is what let this go unnoticed.
        #
        # `-f` rather than `cat || echo`: the two failures are different
        # problems and an operator reading the log has to be able to tell them
        # apart. A missing file is the packer-layout bug above; a `cat` that
        # fails on a file that IS there is a broken workspace, and reporting it
        # as "no verdict.txt" would send whoever reads this log looking in the
        # wrong place. Both warnings go to stderr, where warnings belong.
        if [ -f image-scan/verdict.txt ]; then
          cat image-scan/verdict.txt ||
            echo "WARNING: image-scan/verdict.txt exists but could not be read; the verdict is in the packer output above" >&2
        else
          echo "WARNING: no verdict.txt in the workspace; the verdict is in the packer output above" >&2
        fi

        exit $$rc

  - id: report
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # THE SAME READ AS `packer`, AND FOR THE SAME REASON: each step is its
        # own container, so a shell variable set in `guard` reaches neither of
        # them. Without this line `set -u` kills the step on `IMAGE_VERSION:
        # unbound variable` — measured on build `8cfda54c` (2026-08-26), which
        # had by then created the image `ci-runner-host-gbcae58c` and
        # was reporting nothing but a red build to say so. This step is the
        # LAST one, so its failure lands after forty minutes of work that
        # succeeded, and it names the wrong thing while doing it.
        IMAGE_VERSION="$$(cat /workspace/image_version)"
        gcloud compute images describe "${_IMAGE_FAMILY}-$$IMAGE_VERSION" \
          --project="$PROJECT_ID" \
          --format="value(name,status,diskSizeGb)"
        echo "Pin this exact name in the pool's `image` variable — not the family."

timeout: 3600s
