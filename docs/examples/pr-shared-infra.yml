# The worked example behind docs/ci-pr-shared-infra.md: one host per pull
# request, one shared infrastructure stack per run, and a Windows job that
# reaches that stack across the port band.
#
# WHAT AN ADOPTER ACTUALLY WRITES
#
# Four jobs, and only one of them is new. The anchor's body — pin admission,
# band arithmetic, three degrade branches, the bring-up — is NOT here: it lives
# once, in this repository, at `.github/workflows/shared-infra-anchor.yml`, and
# this example CALLS it. Seven repositories copying seventy-five lines of pin
# logic is seven copies of every future fix to it, and the gate's own RUNNER7
# comment already says the fleet's premise is one reusable workflow rather than
# nine drifting copies.
#
# So what is demonstrated below is the CONSUMER side of the contract, which is
# the part that is irreducibly per-repository: which jobs pin to the anchor,
# which one is Windows, and which one is exempt.
#
# WHY THIS IS A FILE AND NOT A CODE BLOCK IN THE DOCUMENT
#
# A snippet in prose is copied with whatever is wrong with it, and nothing tells
# the author it was wrong until a job on their pool fails — the document already
# shipped one such defect, an owner marker in a spelling the gate does not read,
# which would have declared nothing in every repository that copied it.
#
# This file is checked on every CI run of this repository by
# `scripts/ci/check-shared-infra-example.sh`, which asserts the gate reports it
# CLEAN and then asserts that three mutations of it are each REPORTED. So it is
# not merely conformant, it is conformant at the edge: remove the anchor
# reference, add a second owner, or dial `localhost` on a band port, and the
# check goes red here before it can go red in a consumer.
#
# WHAT IT IS NOT
#
# It is not in `.github/workflows/`, so GitHub never runs it. It cannot be:
# this repository defines the self-hosted fleet and must not need the fleet to
# be healthy in order to fix the fleet (see `.github/workflows/ci.yml`). What
# runs on every pull request here is the CHECK over this file, not the jobs in
# it. The jobs run, for real, in the repositories that adopt it — phase 7 of
# docs/adr-pr-host-affinity.md.
#
# `ExampleRepo` is the repository-scoping label RUNNER1 requires. Replace it
# with yours, everywhere, and change nothing else about the shape.

# RUNNER7. This gate cannot read another repository's file, so it cannot decide
# the callee's runner scope or its timeouts; the marker records that a human
# did, against an issue, rather than letting the exemption hand that property to
# a document nobody checked. The ref is deliberately not part of the marker — a
# pin bump does not change what this gate can read.
# remote-reusable-allowed(Dima-Spectorr/ci-runner-infra/.github/workflows/shared-infra-anchor.yml, #248): the fleet's own published anchor, reviewed in ci-runner-infra

# The marker RUNNER10 counts, and the only way to declare an owner whose
# bring-up happens behind a `uses:` — where no YAML reader can see a `services:`
# block, a `runs-on`, or anything else. Spelling is load-bearing:
# `shared-infra-owner(<job-id>): <what it brings up>`.
# shared-infra-owner(anchor): brings up ci/compose.yaml on this run's Linux host

name: PR

on: [pull_request]

permissions:
  contents: read

# A superseded push must release the host rather than run to completion beside
# its replacement — under this contract a stale run is holding a machine, not
# just a queue slot.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The anchor, which is also the infrastructure owner. Whichever host it lands
  # on becomes this run's host, and it publishes where that was.
  #
  # PIN THE REF TO A RELEASE TAG. The placeholder below is a placeholder on
  # purpose: `check-shared-infra-example.sh` asserts it is still one, so this
  # reference cannot quietly freeze a stale tag into the file seven
  # repositories copy. The anchor talks to host-side contracts — `ci-pin-hold`,
  # `CI_SHARED_INFRA_ADDR`, the port band — which are versioned with the pool
  # image, so `@main` lets the anchor move ahead of the hosts it talks to.
  # ---------------------------------------------------------------------------
  anchor:
    uses: Dima-Spectorr/ci-runner-infra/.github/workflows/shared-infra-anchor.yml@REPLACE-WITH-A-RELEASE-TAG
    with:
      repo-label: ExampleRepo
      # A DEADLINE measured from the anchor, so it must outlive the whole run —
      # here, the 30-minute `test` and `windows` legs plus queueing, not the
      # anchor's own 15.
      pin-ttl: 90m
      # The line the contract is for: it used to run in every job that needed a
      # database. `DATABASE_URL` is in the environment the callee runs this in.
      migrate: ./scripts/db-migrate.sh "$DATABASE_URL"

  # ---------------------------------------------------------------------------
  # Every other fleet Linux job. One line differs from what it was before this
  # contract: `runs-on`.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    needs: [anchor]
    # RUNNER9 and RUNNER4 in one expression. The fork-true branch names a
    # GitHub-hosted image, which is what makes it a guard; written the other way
    # round it hands forks the pool. This is dynamic runner selection, so the
    # gate runs with `--allow-dynamic-runner`; RUNNER9 supplies the specificity
    # that flag gives up, by requiring the anchor's output by name.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.anchor.outputs.runs-on) }}
    timeout-minutes: 30
    env:
      # 127.0.0.1 because this job is on the anchor's host — same machine, and
      # the band port is published there.
      DATABASE_URL: postgres://ci@127.0.0.1:${{ needs.anchor.outputs.pg }}/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/test.sh

  # ---------------------------------------------------------------------------
  # Windows is a SECOND host, on purpose, and is never asked to pin — rule 1's
  # only exception. It reaches the stack across the band, at the Linux host's
  # address.
  # ---------------------------------------------------------------------------
  windows:
    name: Test (Windows)
    needs: [anchor]
    # Here the guard IS a skip, and that is the right answer: there is no
    # hosted substitute for what this leg tests, and fork code must not reach a
    # warm host. Nothing cascades from it — the anchor routes rather than
    # skipping, inside the reusable workflow, so a fork run loses this job and
    # keeps the rest. A repository whose lane model makes this check REQUIRED
    # has to let a skip satisfy it, or forks will sit blocked on a job that was
    # never going to run.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Windows, gcp, ExampleRepo]
    timeout-minutes: 30
    env:
      # RUNNER11. `localhost` here is the WINDOWS machine, where nothing is
      # listening: a refusal or a hang, in a job whose code is right everywhere
      # else. The address comes from the anchor, which read it from the Linux
      # host's CI_SHARED_INFRA_ADDR.
      DATABASE_URL: postgres://ci@${{ needs.anchor.outputs.addr }}:${{ needs.anchor.outputs.pg }}/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/test.ps1
        shell: pwsh

  # ---------------------------------------------------------------------------
  # The escape hatch, in RUNNER7's shape: beside the job, naming the job, with
  # an issue. A job that genuinely must not share the anchor's host says so
  # here, once, where a reviewer sees the reason.
  # ---------------------------------------------------------------------------
  # shared-infra-exempt(lint, #248): a linter touches no database, and pinning
  # it would serialise it behind the anchor for no benefit
  lint:
    name: Lint
    if: github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, linux, gcp, ExampleRepo]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/lint.sh
